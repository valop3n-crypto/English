<style>
  :root{
    --navy:#14283A;
    --navy-deep:#0B1826;
    --cream:#F3ECDA;
    --cream-2:#EAE1C8;
    --line:#D8CBA6;
    --gold:#B8933F;
    --gold-light:#E3C778;
    --ink:#1E2A33;
    --ink-soft:#4A5561;
    --stamp:#2B4C6F;
    --green:#3F7156;
    --red:#A64545;
    --font-display:'Cormorant Garamond', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-deep);
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
  }
  #app{max-width:920px;margin:0 auto;padding-bottom:60px;}
  a,button{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;}

  /* ---- Cover / Header ---- */
  .cover{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--cream);
    padding:28px 24px 34px;
    position:relative;
    border-bottom:4px solid var(--gold);
  }
  .cover-emblem{
    width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--gold-light);
    margin-bottom:14px;
  }
  .cover h1{
    font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,4vw,2.4rem);
    margin:0 0 4px;letter-spacing:.5px;
  }
  .cover p.subtitle{
    margin:0;color:var(--gold-light);font-size:.95rem;letter-spacing:1.5px;text-transform:uppercase;
  }
  .visa-strip{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
  .visa-item{
    display:inline-flex;align-items:center;gap:5px;color:#C9D3DC;font-size:.8rem;
    border:1px solid rgba(227,199,120,.35);border-radius:14px;padding:4px 10px;
  }
  .app-version{font-family:var(--font-mono);font-size:.7rem;color:var(--gold);opacity:.7;vertical-align:middle;margin-left:6px;}
  .icon-pair{display:inline-flex;gap:4px;}
  .icon-pair button{font-size:.65rem;display:inline-flex;align-items:center;gap:2px;}
  .ex-meaning{font-size:.76rem;color:var(--ink-soft);margin:-4px 0 6px 2px;font-style:italic;}
  .ex-meaning strong{color:var(--stamp);font-style:normal;}
  .ai-chat-box{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;min-height:200px;max-height:50vh;overflow-y:auto;margin-bottom:12px;
  }
  .ai-msg{margin-bottom:14px;}
  .ai-msg-role{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);margin-bottom:3px;}
  .ai-msg.ai-user .ai-msg-role{color:var(--stamp);}
  .ai-msg.ai-assistant .ai-msg-role{color:var(--gold);}
  .ai-msg-text{font-size:.9rem;color:var(--ink);line-height:1.55;white-space:pre-wrap;}
  .ai-input-row{display:flex;gap:8px;}
  .ai-input-row input{flex:1;margin-bottom:0;}
  .dialog-box{background:var(--cream-2);border-radius:8px;padding:14px 16px;}
  .dialog-line{font-size:.92rem;color:var(--ink);margin-bottom:10px;line-height:1.5;}
  .dialog-line:last-child{margin-bottom:0;}
  .dialog-line strong{color:var(--navy);}
  .phrase-ok{color:var(--green);}
  .phrase-missing{color:var(--red);}
  .today-suggestion{
    width:100%;text-align:left;display:flex;align-items:center;gap:14px;
    background:#FBF8EE;border:1.5px solid var(--gold);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:18px;cursor:pointer;
  }
  .today-suggestion h4{margin:0 0 2px;color:var(--navy);font-family:var(--font-display);font-size:1.05rem;}
  .today-suggestion p{margin:0;font-size:.85rem;color:var(--ink-soft);}
  .sc-search{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;margin:10px 0 14px;background:#fff;}
  .sc-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .sc-vi{font-size:.88rem;color:var(--ink-soft);margin-top:2px;}
  .sc-formula{font-size:.8rem;color:var(--stamp);margin-top:6px;font-family:var(--font-mono);}
  .sc-alts{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .sc-alt{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .sc-alt .t{flex:1;font-size:.88rem;}
  .sc-alt .t i{display:block;color:var(--ink-soft);font-style:normal;font-size:.8rem;}
  .sc-chip{display:inline-flex;align-items:center;gap:6px;background:var(--cream-2);border-radius:20px;padding:5px 6px 5px 12px;margin:0 6px 6px 0;font-size:.85rem;}
  .sc-tip{background:var(--cream-2);border-radius:10px;padding:10px 12px;font-size:.88rem;margin:10px 0 14px;}
  .sim-bubble{background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px;margin:10px 0;}
  .sim-bubble.me{background:var(--cream-2);border-radius:14px 14px 4px 14px;}
  .sim-opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:.98rem;color:var(--ink);cursor:pointer;}
  .sim-opt.ok{border-color:var(--green);background:#eef7ef;}
  .sim-opt.no{border-color:var(--red);background:#fbeeee;}
  .sim-opt .vi{display:block;font-size:.82rem;color:var(--ink-soft);margin-top:3px;}
  .sim-why{font-size:.85rem;color:var(--ink-soft);margin:-4px 0 10px;padding:0 4px;}
  .sim-write{width:100%;box-sizing:border-box;min-height:80px;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;margin:10px 0;}
  .plan-card{background:linear-gradient(135deg,#14283a,#1f3d57);color:#fff;border-radius:16px;padding:16px;margin:6px 0 16px;}
  .plan-card h3{margin:0 0 4px;font-family:var(--font-display);font-size:1.25rem;}
  .plan-bar{height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin:10px 0;}
  .plan-bar i{display:block;height:100%;background:var(--gold);}
  .plan-step{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .plan-step .chk{width:30px;height:30px;min-width:30px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1rem;}
  .plan-step.done .chk{background:var(--green);border-color:var(--green);color:#fff;}
  .plan-step .tx{flex:1;min-width:0;font-size:.92rem;}
  .plan-step .tx small{display:block;color:var(--ink-soft);}
  details.ref{margin:18px 0;}
  details.ref summary{cursor:pointer;color:var(--ink-soft);font-size:.9rem;padding:8px 0;}
  .mv-stage{position:relative;background:linear-gradient(160deg,#1f3d57,#14283a);border-radius:16px;height:200px;overflow:hidden;margin:10px 0;}
  .mv-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5rem;opacity:.12;}
  .mv-row{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-around;padding-bottom:18px;text-align:center;}
  .mv-av{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:2.6rem;margin:0 auto;transition:transform .25s,box-shadow .25s;opacity:.65;}
  .mv-av.speaking{transform:scale(1.18);box-shadow:0 0 0 6px rgba(255,215,94,.7);opacity:1;}
  .mv-name{color:#fff;font-size:.8rem;margin-top:6px;}
  .mv-en{font-size:1.05rem;font-weight:600;text-align:center;min-height:2.6em;padding:6px 8px;}
  .mv-en.me{color:var(--stamp);}
  #lk-pop{display:none;position:fixed;left:8px;right:8px;bottom:8px;max-height:60vh;overflow:auto;background:#fff;border:1.5px solid var(--navy);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:9999;}
  #lk-pop .lk-close{position:absolute;top:8px;right:10px;border:0;background:var(--cream-2);border-radius:50%;width:30px;height:30px;font-size:.9rem;}
  .tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 22px;}
  .tool-card{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 10px;
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.8rem;color:var(--ink);
  }
  .tool-card:hover{border-color:var(--gold);}
  .tool-icon{display:flex;align-items:center;justify-content:center;color:var(--navy);}
  .cover .desc{margin-top:14px;color:#C9D3DC;font-size:.92rem;max-width:560px;line-height:1.5;}
  .home-link{
    background:none;border:1px solid var(--gold);color:var(--gold-light);
    padding:6px 14px;border-radius:20px;font-size:.85rem;margin-top:16px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .cover-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .voice-settings-btn{
    background:none;border:1px solid var(--gold);color:var(--gold-light);
    padding:6px 12px;border-radius:20px;font-size:.78rem;
    display:inline-flex;align-items:center;gap:6px;
  }
  .voice-settings-btn:hover{background:rgba(184,147,63,.15);}
  .voice-list{display:flex;flex-direction:column;gap:10px;margin:18px 0;}
  .voice-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;
  }
  .voice-row.selected{border-color:var(--stamp);background:rgba(43,76,111,.05);}
  .voice-info{flex:1;min-width:140px;}
  .voice-name{font-weight:600;color:var(--navy);}
  .voice-sub{font-size:.78rem;color:var(--ink-soft);}
  .pitch-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
  .pitch-btn{
    background:#fff;border:1.5px solid var(--line);border-radius:20px;
    padding:10px 18px;font-size:.9rem;color:var(--ink);
  }
  .pitch-btn.pitch-selected{border-color:var(--stamp);background:rgba(43,76,111,.08);color:var(--stamp);font-weight:600;}
  .listen-pair{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .listen-pair .listen-btn{margin-bottom:0;flex:1;min-width:130px;justify-content:center;}

  /* ---- Pages / content area ---- */
  .pages{background:var(--cream);padding:26px 22px 40px;}
  @media(min-width:640px){.pages{padding:34px 40px 48px;}}

  /* ---- Icons ---- */
  .icon-badge{
    width:50px;height:50px;min-width:50px;border-radius:50%;
    border:2px solid var(--gold);color:var(--navy);background:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-badge.lg{width:64px;height:64px;min-width:64px;}
  .icon-badge.on-dark{border-color:var(--gold-light);color:var(--gold-light);background:rgba(255,255,255,.06);}
  .skills-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:var(--ink-soft);}
  .skills-row span.sk{display:inline-flex;align-items:center;gap:4px;margin-right:10px;}
  .skills-row svg{opacity:.75;}

  /* ---- Method card ---- */
  .method-card{
    background:#FBF8EE;border:1px solid var(--gold);border-radius:var(--radius);
    padding:16px 18px;margin:4px 0 24px;display:flex;gap:14px;align-items:flex-start;
  }
  .level-badge{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;
    box-shadow:0 6px 16px rgba(20,40,58,.25);
  }
  .level-badge-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
  .level-num{font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--gold-light);}
  .level-title{font-size:.85rem;color:#C9D3DC;}
  .level-bar{height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;}
  .level-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-light) 100%);border-radius:4px;transition:width .4s ease;}
  .level-xp-text{font-family:var(--font-mono);font-size:.72rem;color:#C9D3DC;margin-top:6px;text-align:right;}
  .xp-toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(0);
    background:var(--navy);color:var(--gold-light);font-family:var(--font-mono);font-weight:600;
    padding:8px 18px;border-radius:20px;box-shadow:0 6px 16px rgba(20,40,58,.35);
    z-index:9999;opacity:1;transition:opacity .5s ease, transform .5s ease;
    border:1px solid var(--gold);
  }
  .xp-toast-out{opacity:0;transform:translateX(-50%) translateY(-16px);}
  .levelup-toast{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);
    background:linear-gradient(135deg,var(--gold) 0%,#8A6B22 100%);color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:1.3rem;text-align:center;
    padding:22px 32px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.4);
    z-index:9999;opacity:1;transition:opacity .5s ease, transform .5s ease;line-height:1.5;
  }
  .levelup-toast span{display:block;font-size:.9rem;font-weight:400;margin-top:4px;font-family:var(--font-body);}
  .levelup-toast-out{opacity:0;transform:translate(-50%,-50%) scale(1.15);}
  @media(prefers-reduced-motion:reduce){.xp-toast,.levelup-toast{transition:none;}}
  .method-card h4{margin:2px 0 8px;color:var(--navy);font-family:var(--font-display);font-size:1.2rem;}
  .method-card ul{margin:0;padding-left:18px;font-size:.87rem;color:var(--ink-soft);line-height:1.65;}
  .method-card li{margin-bottom:2px;}
  .grammar-entry-card{
    background:#FBF8EE;border:1px solid var(--gold);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:22px;display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  }
  .grammar-entry-card h4{margin:0 0 4px;color:var(--navy);font-family:var(--font-display);font-size:1.15rem;}
  .grammar-entry-card p{margin:0;font-size:.85rem;color:var(--ink-soft);}
  .grammar-entry-card .arrow{margin-left:auto;color:var(--gold);font-size:1.3rem;}
  .grammar-list{display:flex;flex-direction:column;gap:14px;margin-top:16px;}
  .grammar-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .grammar-card h4{margin:0 0 6px;color:var(--navy);font-family:var(--font-display);font-size:1.15rem;}
  .grammar-card p{margin:8px 0;font-size:.88rem;color:var(--ink-soft);line-height:1.6;}
  .section-sub{font-family:var(--font-display);color:var(--navy);font-size:1.3rem;margin:28px 0 4px;}
  .word-order-card{border-left:3px solid var(--gold);}
  .foundation-card{border-left:3px solid var(--green);}
  .foundation-banner{
    background:rgba(63,113,86,.08);border:1px solid var(--green);border-radius:10px;
    padding:12px 16px;margin:12px 0 6px;font-size:.9rem;color:var(--ink);line-height:1.6;
  }
  .foundation-banner strong{color:var(--green);}
  .wo-row{display:flex;gap:8px;align-items:baseline;font-size:.88rem;margin:4px 0;}
  .wo-row .wo-flag{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);min-width:52px;}
  .wo-en{color:var(--ink);font-weight:600;}
  .wo-vn{color:var(--ink-soft);}
  .wo-example{
    font-family:var(--font-mono);font-size:.85rem;color:var(--stamp);
    background:var(--cream-2);border-radius:6px;padding:8px 10px;margin:8px 0;
  }
  .ex-list{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .ex-list li{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--cream-2);border-radius:7px;padding:7px 10px;font-size:.86rem;color:var(--ink);
  }
  .ex-play{
    width:26px;height:26px;min-width:26px;border-radius:50%;background:#fff;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--stamp);
  }
  .dictation-box{
    background:#F5F2E7;border:1px dashed var(--gold);border-radius:8px;padding:12px 14px;margin-top:12px;
  }
  .dictation-box .dict-label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--navy);font-weight:600;margin-bottom:8px;}
  .dictation-box input{margin-bottom:8px;}
  .flash-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:32px 24px;text-align:center;min-height:260px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  }
  .flash-label{font-size:.8rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .flash-vn{font-family:var(--font-display);font-size:1.5rem;color:var(--navy);font-weight:600;margin-bottom:16px;line-height:1.35;}
  .flash-divider{width:60px;height:1px;background:var(--line);margin:6px 0 14px;}
  .flash-en{font-family:var(--font-display);font-size:1.3rem;color:var(--stamp);font-weight:600;margin-bottom:14px;}
  .phrase-group{margin-bottom:22px;}
  .phrase-group-title{
    display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;
    font-size:1.05rem;margin-bottom:8px;
  }
  .phrase-row{
    display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:8px;
  }
  .phrase-main{flex:1;min-width:0;}
  .phrase-en{font-weight:600;color:var(--ink);font-size:.95rem;}
  .phrase-casual{font-size:.8rem;color:var(--ink-soft);font-style:italic;margin-top:2px;}
  .phrase-pattern{font-size:.76rem;color:var(--stamp);margin-top:3px;line-height:1.4;}
  .phrase-play{
    width:34px;height:34px;min-width:34px;border-radius:50%;background:#fff;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  }
  .word-row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}

  /* ---- Results ---- */
  .results-wrap{text-align:center;padding:10px 0 6px;}
  .stamp{

/* ===== THEME v47 ===== */
:root{ --navy:#1d2b64; --navy-deep:#141c47; --cream:#f6f7fb; --cream-2:#eceffa; --line:#dfe3f3; --gold:#ff7a45; --gold-light:#ffb48a; --ink:#1f2540; --ink-soft:#5b6384; --stamp:#4d5fe0; --green:#1fa971; --red:#e5484d; --radius:20px; }
body{ background:linear-gradient(180deg,#141c47,#1d2b64 40%,#f6f7fb 40%); }
.pages{ background:var(--cream); border-radius:26px 26px 0 0; margin-top:-14px; position:relative; }

.btn-secondary{ border-radius:16px !important; border:2px solid var(--stamp) !important; color:var(--stamp) !important; background:#fff !important; font-weight:600; }
.sc-card,.topic-card,.tool-card,.sim-opt,.method-card{ border-radius:18px !important; border:1px solid var(--line) !important; box-shadow:0 4px 14px rgba(40,50,110,.07); }
.sim-opt.ok{ background:#e3f7ee !important; border-color:var(--green) !important; } .sim-opt.no{ background:#fde8e9 !important; border-color:var(--red) !important; }
.plan-card{ background:linear-gradient(135deg,#1d2b64,#4d5fe0) !important; border-radius:22px !important; }
.intro-title{ font-family:var(--font-body) !important; font-weight:800; }
.hero47{ background:#fff; border-radius:24px; padding:16px; margin:4px 0 16px; box-shadow:0 10px 30px rgba(40,50,110,.15); }
.hero-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.hero-k{ font-size:.72rem; font-weight:800; letter-spacing:1.5px; color:var(--gold); } .hero-t{ font-size:1.25rem; font-weight:800; color:var(--navy); line-height:1.25; margin-top:2px; } .hero-s{ color:var(--ink-soft); font-size:.9rem; margin-top:2px; }
.hero-stat{ text-align:center; background:#fff3ec; border-radius:14px; padding:8px 10px; font-size:.75rem; color:var(--ink-soft); white-space:nowrap; } .hero-stat b{ display:block; font-size:1.05rem; color:var(--gold); }
.hero-go{ width:100%; margin-top:12px; font-size:1.05rem; }
.h-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
.h-tile{ background:var(--cream-2); border:none; border-radius:16px; padding:10px 4px; font-weight:700; color:var(--navy); font-size:.85rem; cursor:pointer; } .h-tile span{ display:block; font-size:1.5rem; }
.more47{ margin-top:10px; } .more47>summary{ cursor:pointer; font-weight:700; color:var(--stamp); padding:12px 14px; background:#fff; border-radius:16px; border:1px solid var(--line); list-style:none; } .more47[open]>summary{ margin-bottom:12px; }
.les-stage{ border-radius:18px; overflow:hidden; background:#fff; margin:10px 0; box-shadow:0 6px 18px rgba(40,50,110,.12); } .les-stage.mini{ margin:12px 0 0; }

.les-sub{ background:#14183a; color:#fff; border-radius:16px; padding:12px 14px; text-align:center; min-height:76px; } .les-en{ font-size:1.12rem; font-weight:700; line-height:1.35; } .les-vi{ color:#ffd9c2; font-size:.9rem; margin-top:4px; }

/* ============ LỚP ĐỆM LƯU TRỮ — hoạt động cả trong Claude lẫn khi host ngoài (Netlify) ============ */
(function(){
  if(window.storage && typeof window.storage.get === 'function') return; // đã có sẵn (đang xem trong Claude)
  const PREFIX = 'ep_storage_';
  window.storage = {
    get: async (key) => {
      try{
        const raw = localStorage.getItem(PREFIX+key);
        if(raw===null) return null;
        return {key, value: raw, shared:false};
      }catch(e){ return null; }
    },
    set: async (key, value) => {
      try{
        localStorage.setItem(PREFIX+key, value);
        return {key, value, shared:false};
      }catch(e){ return null; }
    },
    delete: async (key) => {
      try{
        localStorage.removeItem(PREFIX+key);
        return {key, deleted:true, shared:false};
      }catch(e){ return null; }
    },
    list: async (prefix) => {
      try{
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(PREFIX+(prefix||''))) keys.push(k.slice(PREFIX.length));
        }
        return {keys, prefix, shared:false};
      }catch(e){ return {keys:[], prefix, shared:false}; }
    }
  };
})();

function pickIcon(text, fallback){
  const t = (text||'').toLowerCase();
  for(const [re, key] of ICON_KEYWORDS){ if(re.test(t)) return key; }
  return fallback;
}
function svgIcon(name, size, color){
  size = size || 24;
  const style = color ? ` style="color:${color}"` : '';
  return `<svg viewBox="0 0 48 48" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"${style}>${ICON_PATHS[name]||''}</svg>`;
}
function ringSvg(percent, size){
  size = size || 46;
  const r = (size/2)-4;
  const c = 2*Math.PI*r;
  const pct = Math.max(0,Math.min(100,percent));
  const filled = pct/100*c;
  const color = pct>=50 ? '#2B4C6F' : '#A64545';
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#D8CBA6" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${filled} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="${color}">${Math.round(pct)}</text>
  </svg>`;
}

let userXP = 0;
const LEVEL_TITLES = [
  {title:'Hành khách mới', minXP:0},
  {title:'Khách quen', minXP:100},
  {title:'Thành viên Bạc', minXP:250},
  {title:'Thành viên Vàng', minXP:450},
  {title:'Thành viên Bạch Kim', minXP:700},
  {title:'Lữ khách dày dạn', minXP:1000},
  {title:'Chuyên gia giao tiếp', minXP:1400},
  {title:'Đại sứ thương hiệu', minXP:1900},
  {title:'Phi công trưởng', minXP:2500},
  {title:'Đại sứ toàn cầu', minXP:3200},
];
function xpForLevel(n){
  if(n <= LEVEL_TITLES.length) return LEVEL_TITLES[n-1].minXP;
  return LEVEL_TITLES[LEVEL_TITLES.length-1].minXP + (n-LEVEL_TITLES.length)*1000;
}
function levelFromXP(xp){
  let lvl = 1;
  while(xpForLevel(lvl+1) <= xp){ lvl++; }
  return lvl;
}
function titleForLevel(lvl){
  if(lvl <= LEVEL_TITLES.length) return LEVEL_TITLES[lvl-1].title;
  return LEVEL_TITLES[LEVEL_TITLES.length-1].title + ' ×' + (lvl - LEVEL_TITLES.length + 1);
}
async function loadXP(){
  try{ const r = await window.storage.get('xp:total', false); if(r) userXP = JSON.parse(r.value).xp || 0; }catch(e){}
}
async function saveXP(){
  try{ await window.storage.set('xp:total', JSON.stringify({xp:userXP}), false); }catch(e){}
}
function addXP(amount){
  try{ markStudied(); }catch(e){}
  const beforeLvl = levelFromXP(userXP);
  userXP += amount;
  saveXP();
  showXPToast(amount);
  const afterLvl = levelFromXP(userXP);
  if(afterLvl > beforeLvl) setTimeout(()=>showLevelUpToast(afterLvl), 900);
}
function showXPToast(amount){
  const toast = document.createElement('div');
  toast.className = 'xp-toast';
  toast.textContent = '+' + amount + ' dặm';
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.classList.add('xp-toast-out'); }, 1100);
  setTimeout(()=>{ toast.remove(); }, 1700);
}
function showLevelUpToast(lvl){
  const toast = document.createElement('div');
  toast.className = 'levelup-toast';
  toast.innerHTML = '🎉 Lên Cấp ' + lvl + '!<br><span>' + titleForLevel(lvl) + '</span>';
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.classList.add('levelup-toast-out'); }, 2200);
  setTimeout(()=>{ toast.remove(); }, 2800);
}
function levelBadgeHtml(){
  const lvl = levelFromXP(userXP);
  const curFloor = xpForLevel(lvl);
  const nextFloor = xpForLevel(lvl+1);
  const pct = Math.min(100, Math.round((userXP-curFloor)/(nextFloor-curFloor)*100));
  return `
  <button class="level-badge" onclick="openRoadmap()" style="width:100%;text-align:left;border:none;cursor:pointer;">
    <div class="level-badge-top">
      <div class="level-num">Cấp ${lvl}</div>
      <div class="level-title">${titleForLevel(lvl)} · Xem lộ trình →</div>
    </div>
    <div class="level-bar"><div class="level-bar-fill" style="width:${pct}%;"></div></div>
    <div class="level-xp-text">${userXP} / ${nextFloor} dặm đến Cấp ${lvl+1}</div>
  </button>`;
}
let cachedVoices = [];
let dictationState = {};
function checkDictation(id, target){
  const el = document.getElementById('dict-'+id);
  const val = el ? el.value : '';
  const grade = gradeFreeText(val, [target]);
  if(grade.tier==='correct' && (!dictationState[id] || !dictationState[id].checked)) addXP(4);
  else if(grade.tier==='close' && (!dictationState[id] || !dictationState[id].checked)) addXP(2);
  dictationState[id] = {checked:true, grade, input:val};
  render();
}
function retryDictation(id){
  dictationState[id] = null;
  render();
}

const SIMS = [{"id": "s1", "title": "Khách mới gọi hỏi thiết kế gian hàng", "icon": "📞", "setup": "Một khách gọi đến công ty bạn, muốn làm gian hàng cho hội chợ tháng sau.", "turns": [{"c": "Hello, I saw your website. Do you design exhibition booths?", "cv": "Chào, tôi thấy website của bạn. Bạn có thiết kế gian hàng triển lãm không?", "good": "Yes, we do. We specialize in exhibition booths.", "gv": "Có, chúng tôi chuyên về gian hàng triển lãm.", "bad": [{"t": "I am a designer.", "w": "Sai ý: khách hỏi bạn có làm gian hàng không, bạn chưa trả lời."}, {"t": "No, thank you.", "w": "Từ chối nhầm: khách đang hỏi để thuê bạn."}]}, {"c": "Great. We have a fair in Hanoi next month.", "cv": "Tuyệt. Chúng tôi có hội chợ ở Hà Nội tháng sau.", "good": "Nice. How big is your booth space?", "gv": "Hay quá. Diện tích gian hàng của anh/chị là bao nhiêu?", "bad": [{"t": "I like Hanoi.", "w": "Lạc đề: bạn cần hỏi thông tin để báo giá."}, {"t": "Please wait.", "w": "Không phù hợp: khách vừa chia sẻ thông tin quan trọng."}]}, {"c": "It's 6 by 3 meters. We want something modern.", "cv": "Rộng 6 nhân 3 mét. Chúng tôi muốn kiểu hiện đại.", "good": "Understood. Do you have any reference photos?", "gv": "Tôi hiểu. Anh/chị có hình tham khảo nào không?", "bad": [{"t": "Modern is very expensive.", "w": "Thiếu lịch sự và nói giá khi chưa biết yêu cầu."}, {"t": "I don't understand.", "w": "Chưa cố hỏi lại; câu của khách khá dễ."}]}, {"c": "Yes, I can send them. What is your price range?", "cv": "Có, tôi gửi được. Mức giá của bên bạn khoảng bao nhiêu?", "good": "It depends on the design. Could I send you a quotation after I see the photos?", "gv": "Tùy vào thiết kế. Tôi gửi báo giá sau khi xem ảnh được không?", "bad": [{"t": "It is 100 million.", "w": "Báo giá chưa biết yêu cầu: dễ sai và mất uy tín."}, {"t": "I don't know.", "w": "Câu trả lời cụt, không giúp chốt việc."}]}, {"c": "Sure. Please send it to my email.", "cv": "Được. Bạn gửi qua email của tôi nhé.", "good": "Of course. Could I have your email address?", "gv": "Dĩ nhiên. Cho tôi xin địa chỉ email của anh/chị?", "bad": [{"t": "Okay, bye.", "w": "Chưa xin email, không gửi được."}, {"t": "Send it to my phone.", "w": "Khách vừa nói email, trả lời lệch ý."}]}], "write": {"vi": "Cảm ơn anh/chị đã liên hệ. Tôi sẽ gửi báo giá trong ngày mai.", "en": "Thank you for contacting us. I will send the quotation tomorrow."}}, {"id": "s2", "title": "Hẹn lịch khảo sát mặt bằng", "icon": "📅", "setup": "Bạn hẹn khách đi xem mặt bằng cửa hàng cần thiết kế nội thất.", "turns": [{"c": "Hi, I want to visit the shop with you. When are you free?", "cv": "Chào, tôi muốn đi xem cửa hàng cùng bạn. Khi nào bạn rảnh?", "good": "I am free on Wednesday afternoon. Does that work for you?", "gv": "Chiều thứ Tư tôi rảnh. Anh/chị có tiện không?", "bad": [{"t": "Yes, I am free.", "w": "Trả lời có/không nhưng không đưa ngày giờ."}, {"t": "Every day.", "w": "Không rõ ràng, khó chốt lịch."}]}, {"c": "Wednesday is busy for me. How about Thursday?", "cv": "Thứ Tư tôi bận. Thứ Năm được không?", "good": "Thursday works for me. What time?", "gv": "Thứ Năm được. Mấy giờ?", "bad": [{"t": "Thursday is bad.", "w": "Từ chối thẳng, thiếu lịch sự."}, {"t": "I don't like Thursday.", "w": "Thiếu lịch sự, không đề xuất giải pháp."}]}, {"c": "Let's say 10 a.m. Where should we meet?", "cv": "Vậy 10 giờ sáng. Mình gặp ở đâu?", "good": "Let's meet in front of the shop. I will send you the address.", "gv": "Mình gặp trước cửa hàng. Tôi sẽ gửi địa chỉ.", "bad": [{"t": "At 10 a.m.", "w": "Lặp lại giờ, chưa trả lời câu hỏi \"ở đâu\"."}, {"t": "Anywhere is fine.", "w": "Quá mơ hồ cho buổi hẹn."}]}, {"c": "Good. Should I bring anything?", "cv": "Tốt. Tôi có cần mang gì không?", "good": "Please bring the floor plan if you have it.", "gv": "Vui lòng mang mặt bằng nếu anh/chị có.", "bad": [{"t": "No, thank you.", "w": "Bỏ lỡ cơ hội nhờ khách chuẩn bị tài liệu."}, {"t": "I don't know.", "w": "Câu cụt, thiếu chuyên nghiệp."}]}, {"c": "I'm sorry, I'm running 15 minutes late.", "cv": "Xin lỗi, tôi sẽ trễ 15 phút.", "good": "No problem. I will wait for you here.", "gv": "Không sao. Tôi sẽ đợi anh/chị ở đây.", "bad": [{"t": "You are late!", "w": "Quá thẳng với khách."}, {"t": "Never mind, I go.", "w": "Không lịch sự, và sai cấu trúc."}]}], "write": {"vi": "Xin lỗi, tôi phải dời lịch sang thứ Sáu.", "en": "I am sorry, I have to reschedule to Friday."}}, {"id": "s3", "title": "Trình bày concept & nhận góp ý", "icon": "💡", "setup": "Bạn thuyết trình concept thiết kế phòng khách cho một khách hàng.", "turns": [{"c": "Please show me your concept.", "cv": "Hãy cho tôi xem concept của bạn.", "good": "Let me walk you through the concept.", "gv": "Để tôi trình bày concept cho anh/chị.", "bad": [{"t": "Look.", "w": "Quá cụt, không dẫn dắt khách."}, {"t": "It is very good.", "w": "Tự khen mà chưa giới thiệu gì."}]}, {"c": "I like the wood, but why this color?", "cv": "Tôi thích gỗ, nhưng sao lại màu này?", "good": "We chose it because it feels warm and natural.", "gv": "Chúng tôi chọn vì nó tạo cảm giác ấm và tự nhiên.", "bad": [{"t": "Because I like it.", "w": "Lý do cá nhân, thiếu thuyết phục với khách."}, {"t": "I don't know.", "w": "Không có lý do, mất uy tín."}]}, {"c": "It's nice, but I think the room feels small.", "cv": "Đẹp, nhưng tôi thấy phòng hơi nhỏ.", "good": "I understand. We can use lighter colors to make it feel bigger.", "gv": "Tôi hiểu. Chúng tôi có thể dùng màu sáng hơn để phòng thấy rộng hơn.", "bad": [{"t": "No, it is not small.", "w": "Cãi khách thay vì giải quyết."}, {"t": "Okay.", "w": "Đồng ý nhưng không đưa giải pháp."}]}, {"c": "Can you change the sofa to gray?", "cv": "Bạn đổi ghế sofa sang màu xám được không?", "good": "Yes, we can. I will send the new version by Friday.", "gv": "Được. Tôi sẽ gửi bản mới trước thứ Sáu.", "bad": [{"t": "Maybe.", "w": "Mơ hồ, không cam kết."}, {"t": "No, I can't.", "w": "Từ chối cộc lốc cho một thay đổi nhỏ."}]}, {"c": "Will it cost more?", "cv": "Việc đó có tốn thêm không?", "good": "No, this change is included in the price.", "gv": "Không, thay đổi này đã nằm trong giá.", "bad": [{"t": "I don't know.", "w": "Không biết giá của chính mình thì mất niềm tin."}, {"t": "Yes, very much.", "w": "Nói quá, chưa giải thích."}]}], "write": {"vi": "Tôi sẽ gửi bản chỉnh sửa trước thứ Sáu.", "en": "I will send the revised version by Friday."}}, {"id": "s4", "title": "Thương lượng giá", "icon": "🤝", "setup": "Khách muốn giảm giá cho gói thiết kế và thi công nội thất.", "turns": [{"c": "Your quotation is a bit over our budget.", "cv": "Báo giá của bạn hơi vượt ngân sách của chúng tôi.", "good": "I understand. What is your budget range?", "gv": "Tôi hiểu. Ngân sách của anh/chị khoảng bao nhiêu?", "bad": [{"t": "No, it is fixed.", "w": "Chốt cứng ngay, dễ mất khách."}, {"t": "Then go to another company.", "w": "Thiếu chuyên nghiệp."}]}, {"c": "We can pay about 80% of this price.", "cv": "Chúng tôi trả được khoảng 80% giá này.", "good": "We can reduce the scope, or we can adjust the materials.", "gv": "Chúng tôi có thể giảm phạm vi, hoặc điều chỉnh vật liệu.", "bad": [{"t": "Okay, no problem.", "w": "Đồng ý ngay làm lỗ mà không trao đổi."}, {"t": "No.", "w": "Từ chối cụt."}]}, {"c": "Which materials can you change?", "cv": "Bạn có thể đổi vật liệu nào?", "good": "We can change the flooring from wood to tile.", "gv": "Chúng tôi có thể đổi sàn từ gỗ sang gạch.", "bad": [{"t": "All of them.", "w": "Quá chung chung và không kiểm soát được chất lượng."}, {"t": "I don't know.", "w": "Không chuẩn bị phương án."}]}, {"c": "If I confirm today, can you give a discount?", "cv": "Nếu tôi xác nhận hôm nay, bạn giảm giá được không?", "good": "If you confirm today, we can give you a 5% discount.", "gv": "Nếu xác nhận hôm nay, chúng tôi giảm 5%.", "bad": [{"t": "Yes, 50%.", "w": "Giảm quá sâu, không hợp lý."}, {"t": "Not possible.", "w": "Từ chối thẳng, bỏ lỡ cơ hội chốt đơn."}]}, {"c": "Okay, 5% and the new materials. Do we have a deal?", "cv": "Được, 5% và vật liệu mới. Vậy mình chốt?", "good": "Yes, we have a deal. I will send the new contract today.", "gv": "Vâng, chốt. Hôm nay tôi gửi hợp đồng mới.", "bad": [{"t": "Maybe tomorrow.", "w": "Do dự sau khi đã thỏa thuận."}, {"t": "Hmm.", "w": "Thiếu rõ ràng."}]}], "write": {"vi": "Chúng tôi cần đặt cọc 30% để bắt đầu.", "en": "We need a 30% deposit to start."}}, {"id": "s5", "title": "Báo trễ hàng cho khách", "icon": "⚠️", "setup": "Vật liệu về trễ, bạn gọi báo khách và đưa giải pháp.", "turns": [{"c": "Hello, how is my project going?", "cv": "Chào, dự án của tôi đang thế nào rồi?", "good": "I'm sorry to inform you that we have a small delay.", "gv": "Rất tiếc báo là chúng tôi bị chậm trễ một chút.", "bad": [{"t": "Everything is fine.", "w": "Nói dối: sau này mất uy tín."}, {"t": "I can't talk now.", "w": "Né tránh khách."}]}, {"c": "What happened?", "cv": "Chuyện gì xảy ra vậy?", "good": "The wood panels will be two days late.", "gv": "Tấm gỗ sẽ về trễ hai ngày.", "bad": [{"t": "It is not my fault.", "w": "Đổ lỗi, không giải quyết."}, {"t": "The supplier is bad.", "w": "Chỉ chê mà không có nguyên nhân rõ."}]}, {"c": "Will you still finish on time?", "cv": "Bạn vẫn xong đúng hạn chứ?", "good": "Yes. We will add two workers, so it won't affect the opening day.", "gv": "Có. Chúng tôi thêm hai thợ nên sẽ không ảnh hưởng ngày khai mạc.", "bad": [{"t": "I hope so.", "w": "Mơ hồ, khách lo thêm."}, {"t": "No.", "w": "Không giải pháp."}]}, {"c": "Okay, but please update me every day.", "cv": "Được, nhưng hãy cập nhật cho tôi mỗi ngày.", "good": "Of course. I will send you a short update every evening.", "gv": "Dĩ nhiên. Mỗi tối tôi sẽ gửi cập nhật ngắn.", "bad": [{"t": "Maybe.", "w": "Không cam kết."}, {"t": "It is too much work.", "w": "Từ chối cộc."}]}, {"c": "Thank you for telling me early.", "cv": "Cảm ơn bạn đã báo sớm.", "good": "Thank you for your understanding.", "gv": "Cảm ơn sự thông cảm của anh/chị.", "bad": [{"t": "Okay.", "w": "Quá cụt sau cuộc nói chuyện quan trọng."}, {"t": "Don't worry.", "w": "Hơi chủ quan, nên nói cảm ơn."}]}], "write": {"vi": "Hàng sẽ giao trễ hai ngày. Chúng tôi xin lỗi vì sự bất tiện.", "en": "The delivery will be two days late. We are sorry for the inconvenience."}}, {"id": "s6", "title": "Đón khách tại booth hội chợ", "icon": "👋", "setup": "Bạn đứng booth, một khách ghé qua xem.", "turns": [{"c": "Hi, this looks interesting. What do you do?", "cv": "Chào, chỗ này trông hay đấy. Bạn làm gì vậy?", "good": "We design and build exhibition booths. Can I show you some projects?", "gv": "Chúng tôi thiết kế và thi công gian hàng triển lãm. Tôi cho anh/chị xem vài dự án nhé?", "bad": [{"t": "Yes.", "w": "Quá ngắn, bỏ lỡ cơ hội giới thiệu."}, {"t": "Please read the brochure.", "w": "Đẩy khách thay vì trò chuyện."}]}, {"c": "Sure. Do you work only in Vietnam?", "cv": "Được. Bạn chỉ làm ở Việt Nam à?", "good": "We work mainly in Vietnam, but we can also support projects abroad.", "gv": "Chúng tôi chủ yếu làm ở Việt Nam, nhưng cũng hỗ trợ dự án nước ngoài.", "bad": [{"t": "Yes.", "w": "Cụt, không mở ra cơ hội."}, {"t": "I don't know.", "w": "Không biết công ty mình làm gì."}]}, {"c": "How long does a booth project take?", "cv": "Một dự án gian hàng mất bao lâu?", "good": "Usually three to four weeks from design to installation.", "gv": "Thường ba đến bốn tuần từ thiết kế đến lắp đặt.", "bad": [{"t": "It is long.", "w": "Mơ hồ, thiếu con số."}, {"t": "Maybe one year.", "w": "Nói sai làm khách bỏ đi."}]}, {"c": "That sounds good. Can I get your contact?", "cv": "Nghe ổn. Cho tôi xin liên hệ của bạn được không?", "good": "Of course. Here is my business card. May I have yours?", "gv": "Dĩ nhiên. Đây là danh thiếp của tôi. Cho tôi xin danh thiếp của anh/chị?", "bad": [{"t": "No, sorry.", "w": "Từ chối khách tiềm năng."}, {"t": "Look at the website.", "w": "Không xin lại liên hệ của khách."}]}, {"c": "I'll call you next week.", "cv": "Tuần sau tôi sẽ gọi bạn.", "good": "Great. I look forward to hearing from you.", "gv": "Tuyệt. Tôi mong sớm nhận được tin từ anh/chị.", "bad": [{"t": "Okay, bye.", "w": "Hơi cụt khi kết thúc."}, {"t": "Please do it now.", "w": "Ép khách."}]}], "write": {"vi": "Rất vui được gặp anh/chị. Tôi sẽ liên hệ lại vào tuần sau.", "en": "It was nice meeting you. I will follow up next week."}}, {"id": "s7", "title": "Nghiệm thu & bàn giao", "icon": "🔑", "setup": "Công trình xong, bạn dẫn khách đi kiểm tra lần cuối.", "turns": [{"c": "The space looks great. Can I check everything?", "cv": "Không gian trông tuyệt. Tôi kiểm tra mọi thứ được không?", "good": "Of course. Please check everything before you sign.", "gv": "Dĩ nhiên. Vui lòng kiểm tra mọi thứ trước khi ký.", "bad": [{"t": "No, it's ready.", "w": "Từ chối khách kiểm tra."}, {"t": "Later.", "w": "Không thể trì hoãn nghiệm thu."}]}, {"c": "There is a scratch on this wall.", "cv": "Có một vết xước trên bức tường này.", "good": "I'm sorry about that. We will fix it within two days.", "gv": "Xin lỗi về việc đó. Chúng tôi sẽ sửa trong hai ngày.", "bad": [{"t": "It is small.", "w": "Hạ thấp lo ngại của khách."}, {"t": "It was there before.", "w": "Đổ lỗi, thiếu bằng chứng."}]}, {"c": "The lights are not working in the corner.", "cv": "Đèn ở góc không sáng.", "good": "Let me check. It may be a wiring problem.", "gv": "Để tôi kiểm tra. Có thể do dây điện.", "bad": [{"t": "Maybe the bulb is bad.", "w": "Đoán mò khi chưa kiểm tra."}, {"t": "Not my job.", "w": "Không chịu trách nhiệm."}]}, {"c": "Okay. What about the warranty?", "cv": "Được. Còn bảo hành thì sao?", "good": "The warranty covers one year. Here is the warranty card.", "gv": "Bảo hành một năm. Đây là thẻ bảo hành.", "bad": [{"t": "There is no warranty.", "w": "Sai thông tin, mất quyền lợi khách."}, {"t": "Check the contract.", "w": "Không trả lời trực tiếp."}]}, {"c": "Thank you. I'm very satisfied.", "cv": "Cảm ơn. Tôi rất hài lòng.", "good": "Thank you. Please contact us if anything goes wrong.", "gv": "Cảm ơn. Vui lòng liên hệ chúng tôi nếu có gì trục trặc.", "bad": [{"t": "Okay.", "w": "Quá cụt."}, {"t": "Pay me now.", "w": "Thiếu tế nhị."}]}], "write": {"vi": "Đây là chìa khóa và thẻ bảo hành.", "en": "Here are the keys and the warranty card."}}, {"id": "s8", "title": "Xử lý khách phàn nàn", "icon": "🛠️", "setup": "Khách gọi phàn nàn vì sàn bị bong sau một tuần.", "turns": [{"c": "The floor is already coming off. I'm very unhappy.", "cv": "Sàn đã bị bong rồi. Tôi rất không hài lòng.", "good": "I'm very sorry for the inconvenience. Can you tell me what happened?", "gv": "Tôi rất xin lỗi vì sự bất tiện. Anh/chị kể tôi nghe chuyện gì xảy ra được không?", "bad": [{"t": "It is normal.", "w": "Hạ thấp vấn đề, khách sẽ giận hơn."}, {"t": "You did something wrong.", "w": "Đổ lỗi cho khách."}]}, {"c": "Near the window, the wood is lifting up.", "cv": "Gần cửa sổ, gỗ bị phồng lên.", "good": "I understand. Could you send me a photo?", "gv": "Tôi hiểu. Anh/chị gửi tôi một tấm ảnh được không?", "bad": [{"t": "Okay.", "w": "Không có hành động."}, {"t": "It is the weather.", "w": "Viện cớ."}]}, {"c": "Here is the photo. What will you do?", "cv": "Đây là ảnh. Bạn sẽ làm gì?", "good": "We will send someone tomorrow morning to fix it.", "gv": "Sáng mai chúng tôi sẽ cử người đến sửa.", "bad": [{"t": "I will think about it.", "w": "Không cam kết."}, {"t": "Maybe next week.", "w": "Quá chậm, khách thêm giận."}]}, {"c": "Is this covered by the warranty?", "cv": "Việc này có nằm trong bảo hành không?", "good": "Yes, it is covered. This is our responsibility.", "gv": "Có, nằm trong bảo hành. Đây là trách nhiệm của chúng tôi.", "bad": [{"t": "No.", "w": "Từ chối khi chưa kiểm tra."}, {"t": "I don't know.", "w": "Thiếu chuyên nghiệp."}]}, {"c": "Okay, thank you for responding quickly.", "cv": "Được, cảm ơn bạn đã phản hồi nhanh.", "good": "Thank you for telling us. We would like to make it right.", "gv": "Cảm ơn đã báo cho chúng tôi. Chúng tôi muốn làm cho đúng.", "bad": [{"t": "You're welcome.", "w": "Ổn nhưng thiếu cam kết sửa lỗi."}, {"t": "Don't call me again.", "w": "Rất thiếu lịch sự."}]}], "write": {"vi": "Chúng tôi sẽ cử người đến sửa vào sáng mai.", "en": "We will send someone to fix it tomorrow morning."}}, {"id": "s9", "title": "Tìm hiểu nhu cầu cải tạo văn phòng", "icon": "🔍", "setup": "Khách muốn cải tạo văn phòng nhưng chưa biết bắt đầu từ đâu.", "turns": [{"c": "We want to redesign our office, but I'm not sure where to start.", "cv": "Chúng tôi muốn cải tạo văn phòng, nhưng chưa biết bắt đầu từ đâu.", "good": "No problem. Let me ask a few questions first. How many people work there?", "gv": "Không sao. Để tôi hỏi vài câu trước. Có bao nhiêu người làm việc ở đó?", "bad": [{"t": "Just give me the money first.", "w": "Đòi tiền trước khi hiểu nhu cầu."}, {"t": "It's easy, don't worry.", "w": "Hứa suông mà chưa nghe khách."}]}, {"c": "About twenty people.", "cv": "Khoảng hai mươi người.", "good": "Got it. What kind of atmosphere do you want, formal or relaxed?", "gv": "Tôi hiểu. Anh/chị muốn không khí thế nào, trang trọng hay thoải mái?", "bad": [{"t": "Twenty is too many.", "w": "Chê khách, không giúp ích."}, {"t": "I don't care.", "w": "Thiếu quan tâm."}]}, {"c": "Relaxed, but still professional. And we need a meeting room.", "cv": "Thoải mái nhưng vẫn chuyên nghiệp. Và chúng tôi cần một phòng họp.", "good": "Understood. Do you have any photos of styles you like?", "gv": "Tôi hiểu. Anh/chị có ảnh phong cách nào mình thích không?", "bad": [{"t": "Meeting rooms are expensive.", "w": "Nói chi phí quá sớm, làm khách e ngại."}, {"t": "Professional is boring.", "w": "Chê ý của khách."}]}, {"c": "Yes, I'll send some. We also have a tight budget.", "cv": "Có, tôi sẽ gửi vài ảnh. Chúng tôi cũng có ngân sách khá hạn hẹp.", "good": "That's fine. Could you tell me your budget range so I can plan the materials?", "gv": "Không sao. Anh/chị cho tôi biết khoảng ngân sách để tôi lên kế hoạch vật liệu nhé?", "bad": [{"t": "Then why redesign?", "w": "Hỏi móc máy, thiếu lịch sự."}, {"t": "Tight budgets are difficult.", "w": "Than phiền, không giải quyết."}]}, {"c": "Around 300 million. Can you finish before Tet?", "cv": "Khoảng 300 triệu. Bạn có xong trước Tết được không?", "good": "Let me check the schedule. I will confirm by tomorrow.", "gv": "Để tôi kiểm tra lịch. Ngày mai tôi sẽ xác nhận.", "bad": [{"t": "Of course, no problem.", "w": "Hứa vội khi chưa kiểm tra lịch."}, {"t": "No, impossible.", "w": "Từ chối cộc, chưa xem xét."}]}], "write": {"vi": "Anh/chị cho tôi biết khoảng ngân sách được không?", "en": "Could you tell me your budget range?"}}, {"id": "s10", "title": "THỬ THÁCH CUỐI: Họp dự án phức tạp", "icon": "🏆", "setup": "Cuộc họp dài với khách về dự án gian hàng: thiết kế, giá, tiến độ, rủi ro, xã giao.", "turns": [{"c": "Thanks for coming. Let's go over the status of the booth project.", "cv": "Cảm ơn đã đến. Mình cùng xem tình hình dự án gian hàng nhé.", "good": "Thank you for having us. I'll start with a quick update on the design and schedule.", "gv": "Cảm ơn đã đón tiếp. Tôi sẽ bắt đầu bằng cập nhật nhanh về thiết kế và tiến độ.", "bad": [{"t": "Okay, whatever you want.", "w": "Thụ động, không chủ động dẫn họp."}, {"t": "I am busy now.", "w": "Rất thiếu chuyên nghiệp."}]}, {"c": "The design looks good, but the entrance feels too narrow.", "cv": "Thiết kế ổn, nhưng lối vào có vẻ hơi hẹp.", "good": "That's a fair point. We can widen the entrance by one meter without changing the layout.", "gv": "Đó là ý hợp lý. Chúng tôi có thể mở rộng lối vào thêm một mét mà không đổi bố cục.", "bad": [{"t": "No, it is the standard size.", "w": "Cãi khách, không đưa giải pháp."}, {"t": "It is your idea, not mine.", "w": "Đổ lỗi cho khách."}]}, {"c": "Wider is better. What will that do to the cost?", "cv": "Rộng hơn thì tốt. Việc đó ảnh hưởng chi phí thế nào?", "good": "It adds about five million VND for extra materials. I'll include it in a revised quotation.", "gv": "Phát sinh khoảng năm triệu cho vật liệu thêm. Tôi sẽ đưa vào báo giá sửa đổi.", "bad": [{"t": "Nothing, it is free.", "w": "Nói sai, mất lợi nhuận và uy tín."}, {"t": "I don't know the cost.", "w": "Không nắm số liệu của chính mình."}]}, {"c": "Five million is fine. Now, the timeline. Can you install two days earlier?", "cv": "Năm triệu thì được. Giờ đến tiến độ. Bạn lắp đặt sớm hơn hai ngày được không?", "good": "That would be tight. If you approve the design by Friday, we can try to install one day earlier.", "gv": "Sẽ khá gấp. Nếu anh/chị duyệt thiết kế trước thứ Sáu, chúng tôi sẽ cố lắp sớm một ngày.", "bad": [{"t": "Sure, no problem at all.", "w": "Hứa quá sức, rủi ro trễ hạn."}, {"t": "Two days earlier is crazy.", "w": "Phản ứng thiếu lịch sự."}]}, {"c": "Okay, we'll approve by Friday. What about the lighting? Our logo needs to stand out.", "cv": "Được, chúng tôi sẽ duyệt trước thứ Sáu. Còn ánh sáng thì sao? Logo cần nổi bật.", "good": "We recommend warm LED spotlights on the logo wall. Would you like to see a sample?", "gv": "Chúng tôi đề xuất đèn LED spotlight ánh sáng ấm cho tường logo. Anh/chị muốn xem mẫu không?", "bad": [{"t": "Lighting is not important.", "w": "Sai ý, khách đang quan tâm."}, {"t": "Any light is fine.", "w": "Thiếu chuyên môn."}]}, {"c": "Yes, please. By the way, how was your trip to Da Nang last week?", "cv": "Có, cho tôi xem nhé. À mà chuyến đi Đà Nẵng tuần trước của bạn thế nào?", "good": "It was great, thank you for asking. The weather was lovely. How was your weekend?", "gv": "Rất tuyệt, cảm ơn anh/chị đã hỏi. Thời tiết đẹp lắm. Cuối tuần của anh/chị thế nào?", "bad": [{"t": "Why do you ask?", "w": "Nghi ngờ vô lý, phá vỡ không khí."}, {"t": "Fine.", "w": "Quá cụt trong xã giao."}]}, {"c": "Good. Now, I'm a bit worried about the delivery of the wood panels.", "cv": "Tốt. Giờ tôi hơi lo về việc giao tấm gỗ.", "good": "I understand your concern. We have confirmed the delivery date and prepared a backup supplier.", "gv": "Tôi hiểu lo ngại của anh/chị. Chúng tôi đã xác nhận ngày giao và chuẩn bị nhà cung cấp dự phòng.", "bad": [{"t": "Don't worry, it's fine.", "w": "Trấn an suông, không có bằng chứng."}, {"t": "It is the supplier's problem.", "w": "Đổ lỗi cho nhà cung cấp."}]}, {"c": "That helps. What happens if something goes wrong on site?", "cv": "Vậy là yên tâm hơn. Nếu có sự cố tại công trình thì sao?", "good": "We will have a team on site every day, and we will report any problem to you within an hour.", "gv": "Chúng tôi sẽ có đội tại công trình mỗi ngày và báo mọi sự cố cho anh/chị trong vòng một giờ.", "bad": [{"t": "Nothing will go wrong.", "w": "Tuyệt đối hóa, thiếu thực tế."}, {"t": "Then you call us.", "w": "Đẩy trách nhiệm cho khách."}]}, {"c": "Good. Can we put these points in writing?", "cv": "Tốt. Mình ghi các điểm này bằng văn bản được không?", "good": "Of course. I will send a summary email with the next steps by this afternoon.", "gv": "Dĩ nhiên. Chiều nay tôi sẽ gửi email tóm tắt các bước tiếp theo.", "bad": [{"t": "Writing takes time.", "w": "Từ chối việc hợp lý của khách."}, {"t": "No, trust me.", "w": "Thiếu minh bạch."}]}, {"c": "Great. Thank you for your time today.", "cv": "Tuyệt. Cảm ơn anh/chị đã dành thời gian hôm nay.", "good": "Thank you for your trust. We look forward to a successful exhibition.", "gv": "Cảm ơn sự tin tưởng của anh/chị. Chúng tôi mong một kỳ triển lãm thành công.", "bad": [{"t": "Okay, bye.", "w": "Kết thúc quá cụt sau cuộc họp quan trọng."}, {"t": "Pay me first.", "w": "Rất thiếu tế nhị."}]}], "write": {"vi": "Tôi sẽ gửi email tóm tắt các bước tiếp theo trước chiều nay.", "en": "I will send a summary email with the next steps by this afternoon."}}];

en": "There will be no additional charge.", "vi": "Sẽ không có phí phát sinh."}}, "l4.k4": {"why": "Báo ngay mức phát sinh để khách quyết định, tránh tranh cãi về sau.", "casual": {"en": "That will add about ten million.", "vi": "Việc đó cộng thêm khoảng mười triệu."}, "formal": {"en": "This would incur an additional cost of around ten million.", "vi": "Việc này sẽ phát sinh thêm khoảng mười triệu."}}, "l5.k1": {"why": "\"I'm afraid\" làm câu báo tin xấu nghe mềm, lịch sự hơn nói thẳng.", "casual": {"en": "Sorry, but...", "vi": "Xin lỗi, nhưng..."}, "formal": {"en": "Unfortunately, ...", "vi": "Rất tiếc là..."}}, "l5.k2": {"why": "Báo tin xấu phải kèm hành động khắc phục. \"catch up\" = bắt kịp tiến độ.", "casual": {"en": "We'll make up the time.", "vi": "Chúng tôi sẽ bù thời gian."}, "formal": {"en": "We will take measures to get back on schedule.", "vi": "Chúng tôi sẽ có biện pháp để kịp tiến độ."}}, "l5.k3": {"why": "\"by\" = chậm nhất vào lúc đó. Hứa deadline rõ ràng.", "casual": {"en": "It'll be done by Friday.", "vi": "Thứ Sáu là xong."}, "formal": {"en": "We will complete it no later than Friday.", "vi": "Chúng tôi sẽ hoàn thành chậm nhất thứ Sáu."}}, "l5.k4": {"why": "Khách đang lo thì cần được báo thường xuyên. Câu này xin họ cứ hỏi/ nhắc bạn.", "casual": {"en": "Keep me posted.", "vi": "Cập nhật cho mình nhé."}, "formal": {"en": "Please update me regularly.", "vi": "Vui lòng cập nhật cho tôi thường xuyên."}}, "l6.k1": {"why": "Hỏi trước khi nói chuyện dài, để khách không bị làm phiền. Rất tự nhiên ở người thật.", "casual": {"en": "Got a minute?", "vi": "Có rảnh một chút không?"}, "formal": {"en": "Do you have a moment?", "vi": "Bạn có chút thời gian không?"}}, "l6.k2": {"why": "Nói lý do gọi ngay câu đầu để cuộc gọi gọn.", "casual": {"en": "I'm reaching out about...", "vi": "Mình liên hệ về..."}, "formal": {"en": "I'm getting in touch regarding...", "vi": "Tôi liên hệ liên quan đến..."}}, "l6.k3": {"why": "\"works for me\" = tiện cho tôi. Cách chốt lịch nh function shuffleArr(arr){

const SRS_INTERVALS = [0, 1, 3, 7, 14, 30]; // số ngày trước khi ôn lại, theo từng "hộp"
let srsData = {};
function todayStr(){ return new Date().toISOString().slice(0,10); }
function srsKey(prefix, idx){ return prefix+':'+idx; }
async function loadSrs(){
  try{ const r = await window.storage.get('srs:data', false); if(r) srsData = JSON.parse(r.value); }catch(e){}
}
async function saveSrs(){
  try{ await window.storage.set('srs:data', JSON.stringify(srsData), false); }catch(e){}
}
function getSrsEntry(key){
  return srsData[key] || {box:0, nextDue: todayStr()};
}
function updateSrsEntry(key, correct){
  const e = getSrsEntry(key);
  e.box = correct ? Math.min(e.box+1, SRS_INTERVALS.length-1) : 0;
  const d = new Date();
  d.setDate(d.getDate() + SRS_INTERVALS[e.box]);
  e.nextDue = d.toISOString().slice(0,10);
  srsData[key] = e;
  saveSrs();
}
function countDue(totalCount, prefix){
  const today = todayStr();
  let n = 0;
  for(let i=0;i<totalCount;i++){ if(getSrsEntry(srsKey(prefix,i)).nextDue <= today) n++; }
  return n;
}
function buildDueDeck(totalCount, prefix){
  const today = todayStr();
  const indices = Array.from({length:totalCount}, (_,i)=>i);
  const due = indices.filter(i => getSrsEntry(srsKey(prefix,i)).nextDue <= today);
  shuffleArr(due).sort((a,b)=> getSrsEntry(srsKey(prefix,a)).box - getSrsEntry(srsKey(prefix,b)).box);
  return due.length > 0 ? due : shuffleArr(indices);
}

/* ============ UTILS ============ */
function normalize(s){
  return (s||'').toLowerCase().replace(/[.,!?;:'"’]/g,'').replace(/\s+/g,' ').trim();
}
function wordOverlap(a,b){
  const wa = normalize(a).split(' ').filter(Boolean);
  const wb = normalize(b).split(' ').filter(Boolean);
  if(wa.length===0||wb.length===0) return 0;
  const setA = new Set(wa);
  let hit=0;
  wb.forEach(w=>{ if(setA.has(w)) hit++; });
  return hit/wb.length;
}
function gradeFreeText(userInput, acceptedList){
  let best = 0, bestAcc = acceptedList[0];
  acceptedList.forEach(acc=>{
    if(normalize(userInput)===normalize(acc)){ if(1>best){best=1; bestAcc=acc;} return; }
    const o = wordOverlap(userInput, acc);
    if(o > best){ best = o; bestAcc = acc; }
  });
  let tier = 'wrong';
  if(best >= 0.85) tier = 'correct';
  else if(best >= 0.5) tier = 'close';
  return {tier, pct:Math.round(best*100), bestAcc};
}
function diffMissingWords(userInput, target){
  const uw = new Set(normalize(userInput).split(' ').filter(Boolean));
  const tw = normalize(target).split(' ').filter(Boolean);
  const missing = tw.filter(w=>!uw.has(w));
  return missing;
}
function gradeLegendHtml(){
  return `<div class="grade-legend">✓ ≥85% Chính xác &nbsp;·&nbsp; 〜 50-84% Chấp nhận được &nbsp;·&nbsp; ✗ &lt;50% Chưa đạt</div>`;
}
function writingExplainHtml(grade, userInput, correctAnswer, chunk){
  const missing = diffMissingWords(userInput, correctAnswer);
  let missingLine = '';
  if(grade.tier !== 'correct' && missing.length){
    missingLine = `<div class="explain-line">Còn thiếu/khác so với câu chuẩn: <strong>${missing.join(', ')}</strong></div>`;
  }
  const chunkLine = chunk
    ? `<div class="explain-line"><strong>Cấu trúc:</strong> ${chunk.pattern} — ${chunk.explain}</div>`
    : '';
  if(!missingLine && !chunkLine) return '';
  return `<div class="explain-box">${missingLine}${chunkLine}</div>`;
}

function speak(text, forceVoiceURI, forcePitch, forceRate){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = forceRate || 0.92;
    u.pitch = forcePitch !== undefined ? forcePitch : settings.pitch;

    const useURI = forceVoiceURI !== undefined ? forceVoiceURI : settings.voiceURI;

    if(!chosen) chosen = voices.find(v=>v.lang && v.lang.toLowerCase()==='en-us') || voices[0];
    if(chosen){ u.voice = chosen; u.lang = chosen.lang; }
    window.speechSynthesis.speak(u);
  }catch(e){ console.error('TTS error', e); }
}

/* --- bài thi qua chặng --- */
let stg = null;
function pickN(arr,n){ return shuffleArr(arr).slice(0,n); }
function buildStageExam(n){
  const st = STAGES[n-1];
  const own = []; st.sc.forEach(id=>SCENARIOS.find(x=>x.id===id).phrases.forEach(p=>own.push(p)));
  const all = []; SCENARIOS.forEach(sc=>sc.phrases.forEach(p=>all.push(p)));
  const qs = [];
  const mk = (correct, wrongPool, key)=>{
    const wrong = pickN(wrongPool.filter(p=>p[key]!==correct[key]),3);
    return shuffleArr([{t:correct[key],ok:true}].concat(wrong.map(p=>({t:p[key],ok:false}))));
  };
  const chosen = pickN(own,6);
  chosen.slice(0,3).forEach(p=>qs.push({type:'listen', prompt:'Nghe và chọn nghĩa đúng:', say:p.en, opts:mk(p,all,'vi'), reveal:p.en+' = '+p.vi}));
  chosen.slice(3,6).forEach(p=>qs.push({type:'read', prompt:'Câu nào diễn đạt đúng: "'+p.vi+'"?', opts:mk(p,all,'en'), reveal:p.en+' — '+p.pattern}));
  pickN(STYLE_PACKS[n],3).forEach(x=>qs.push({type:'polite', prompt:'Bạn nói với khách quan trọng ("'+x.sit+'"). Câu nào lịch sự hơn?', opts:shuffleArr([{t:x.casual,ok:false},{t:x.polite,ok:true}]), reveal:x.note}));
  const turns = []; st.sims.forEach(i=>SIMS[i].turns.forEach(t=>turns.push(t)));
  pickN(turns, n===6?6:3).forEach(t=>qs.push({type:'reply', prompt:'Khách nói: "'+t.c+'"', say:t.c, opts:shuffleArr([{t:t.good,ok:true,w:t.gv}].concat(t.bad.map(b=>({t:b.t,ok:false,w:b.w})))), reveal:t.gv}));
  return qs;
}
function startStageExam(n){ stg={n, qs:buildStageExam(n), i:0, picked:null, right:0}; state.view='stageExam'; render(); stgSay(); }
function stgSay(){ const q = stg.qs[stg.i]; if(q && q.say) setTimeout(()=>speak(q.say),250); }
function stgPick(k){
  if(stg.picked!==null) return;
  stg.picked = k; if(stg.qs[stg.i].opts[k].ok){ stg.right++; addXP(1); }
  sfx(stg.qs[stg.i].opts[k].ok?'ok':'bad');
  render();
}
function stgNext(){
  stg.i++; stg.picked=null;
  if(stg.i>=stg.qs.length){
    const pct = Math.round(stg.right/stg.qs.length*100);
    stg.pct = pct; stg.pass = pct>=70;
    if(stg.pass){
      const prev = stageState.passed[stg.n];
      const first = !prev;
      stageState.passed[stg.n] = {best: Math.max(pct, prev?prev.best:0)};
      saveStages(); addXP(first?30:5);
    }
    sfx(stg.pass?'win':'lose');
    state.view='stageResult'; render(); return;
  }
  render(); stgSay();
}
function renderStageExam(){
  const st = STAGES[stg.n-1], q = stg.qs[stg.i], ans = stg.picked!==null;
  const opts = q.opts.map((o,k)=>{
    let cls='sim-opt', extra='';
    if(ans){ if(o.ok) cls+=' ok'; else if(k===stg.picked){ cls+=' no'; if(o.w) extra=`<div class="sim-why">${o.w}</div>`; } }
    return `<button class="${cls}" ${ans?'disabled':`onclick="stgPick(${k})"`}>${o.t}</button>${extra}`;
  }).join('');
  const fb = ans ? `<div class="sim-bubble me">${q.opts[stg.picked].ok?'✅ Đúng! ':'❌ Chưa đúng. '}<span class="sc-vi">${q.reveal}</span></div><button class="btn-primary" onclick="stgNext()">${stg.i+1>=stg.qs.length?'Xem kết quả →':'Câu tiếp →'}</button>` : '';
  const listen = q.say ? `<div style="margin:6px 0;">${listenIconPairHtml(q.say,'phrase-play','')}</div>` : '';
  return `${headerHtml(false)}<div class="pages">
    <button class="home-link" style="margin-bottom:12px;color:var(--navy);border-color:var(--navy);" onclick="if(confirm('Thoát bài thi?')) openStage(${stg.n})">← Thoát</button>
    <div class="item-count">${st.icon} Thi chặng ${st.n} · Câu ${stg.i+1}/${stg.qs.length}</div>
    <p style="font-size:1.02rem;margin:10px 0 4px;"><strong>${q.prompt}</strong></p>${listen}${opts}${fb}</div>`;
}
function renderStageResult(){
  const st = STAGES[stg.n-1], next = STAGES[stg.n];
  return `${headerHtml(false)}<div class="pages" style="text-align:center;">
    <div style="font-size:3rem;">${stg.pass?'🏅':'💪'}</div>
    <h2 class="intro-title" style="justify-content:center;">${stg.pass?'Qua chặng '+st.n+'!':'Chưa đạt, thử lại nhé'}</h2>
    <p style="color:var(--ink-soft);">Đúng ${stg.right}/${stg.qs.length} (${stg.pct}%). Cần từ 70%.</p>
    ${stg.pass? (next?`<p>🔓 Đã mở <strong>Chặng ${next.n}: ${next.title}</strong></p>`:'<p>🎓 Bạn đã hoàn thành toàn bộ 6 chặng!</p>') : '<p style="color:var(--ink-soft);">Ôn lại bài học, phần Đời thường vs Lịch sự rồi thi lại. Đề mỗi lần một khác.</p>'}
    <button class="btn-primary" onclick="${stg.pass&&next?`openStage(${next.n})`:`openStage(${st.n})`}">${stg.pass&&next?'Sang chặng tiếp theo':'Ôn lại chặng này'}</button>
    <button class="btn-secondary" onclick="startStageExam(${st.n})">Thi lại</button>
    <button class="btn-secondary" onclick="openStages()">Về bản đồ chặng</button></div>`;

function movieUI(L,msg){

let hs = null;
function openHotspot(id){ hs={scene:id, mode:'explore', target:null, info:null, score:0, tries:0, msg:''}; state.view='hotspot'; render(); }
function hsTap(id){
  const sc = HOT_SCENES[hs.scene], it = sc.items.find(x=>x.id===id);
  if(hs.mode==='explore'){ hs.info=it; speak(it.en); render(); return; }
  if(hs.target && hs.target.id===id){ sfx('ok'); hs.score++; addXP(1); hs.msg='✅ Đúng! '+it.en+' = '+it.vi; hsNewTarget(); }
  else { sfx('bad'); hs.msg='❌ Đó là "'+it.en+'" ('+it.vi+'). Nghe lại và thử nữa.'; speak(hs.target.en); render(); return; }
  render();
}
function hsNewTarget(){ const sc=HOT_SCENES[hs.scene]; let t; do{ t=sc.items[Math.floor(Math.random()*sc.items.length)]; }while(hs.target && t.id===hs.target.id && sc.items.length>1); hs.target=t; setTimeout(()=>speak(t.en),350); }
function hsMode(m){ hs.mode=m; hs.msg=''; hs.info=null; if(m==='quiz'){ hs.score=0; hsNewTarget(); } render(); }
function hsSvg(){
  const sc = HOT_SCENES[hs.scene];
  const els = sc.items.map(it=>{
    const sel = (hs.info&&hs.info.id===it.id) ? ' stroke="#e11" stroke-width="3"' : (it.s?` stroke="${it.s}" stroke-width="1.5"`:'');
    const oc = `onclick="hsTap('${it.id}')" style="cursor:pointer"`;
    if(it.t==='c') return `<circle cx="${it.cx}" cy="${it.cy}" r="${it.r}" fill="${it.f}"${sel} ${oc}/>`;
    return `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" rx="3" fill="${it.f}"${sel} ${oc}/>`;
  }).join('');
  const label = hs.scene==='booth' ? `<text x="180" y="68" text-anchor="middle" font-size="14" fill="#ffd75e" font-weight="700" pointer-events="none">LOGO</text>` : '';
  return `<svg viewBox="0 0 360 240" style="width:100%;border-radius:12px;background:${sc.bg};touch-action:manipulation;">${els}${label}</svg>`;
}
function renderHotspot(){
  const sc = HOT_SCENES[hs.scene];
  const info = hs.mode==='explore'
    ? (hs.info? `<div class="sim-bubble me"><strong style="font-size:1.1rem;">${hs.info.en}</strong> ${listenIconPairHtml(hs.info.en,'phrase-play','')}<div class="sc-vi">${hs.info.vi}</div></div>` : `<p style="color:var(--ink-soft);">Chạm vào một vật trong hình để nghe tên tiếng Anh.</p>`)
    : `<div class="sim-bubble me">🎧 Nghe và chạm đúng vật ${hs.target?listenIconPairHtml(hs.target.en,'phrase-play',''):''} · Điểm: <strong>${hs.score}</strong><div class="sc-vi">${hs.msg||'Nghe từ rồi chạm vào vật tương ứng.'}</div></div>`;
  const list = HOT_SCENES ? Object.keys(HOT_SCENES).map(k=>`<button class="${k===hs.scene?'btn-primary':'btn-secondary'}" style="padding:8px 12px;" onclick="openHotspot('${k}')">${HOT_SCENES[k].title}</button>`).join(' ') : '';

let sfxOn = true, audioCtx = null;
async function loadSfx(){ try{ const r = await window.storage.get('settings:sfx', false); if(r) sfxOn = JSON.parse(r.value).on !== false; }catch(e){} }
function toggleSfx(){ sfxOn = !sfxOn; try{ window.storage.set('settings:sfx', JSON.stringify({on:sfxOn}), false); }catch(e){} if(sfxOn) sfx('ok'); render(); }
function sfxTone(c, freq, start, dur, type, vol){
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
  o.connect(g); g.connect(c.destination); o.start(start); o.stop(start+dur+0.05);
}
function sfx(kind){
  if(!sfxOn) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const c = audioCtx, t = c.currentTime + 0.02;
    if(kind==='ok'){ [523.25,659.25,783.99].forEach((f,i)=>sfxTone(c,f,t+i*0.09,0.25,'sine',0.16)); }
    else if(kind==='bad'){ sfxTone(c,233,t,0.2,'triangle',0.18); sfxTone(c,175,t+0.17,0.32,'triangle',0.18); }
    else if(kind==='win'){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>sfxTone(c,f,t+i*0.12,0.35,'sine',0.17)); [523.25,659.25,783.99].forEach(f=>sfxTone(c,f,t+0.5,0.7,'triangle',0.1)); }
    else if(kind==='lose'){ [392,349.23,311.13,261.63].forEach((f,i)=>sfxTone(c,f,t+i*0.16,0.3,'triangle',0.15)); }
  }catch(e){}
}

function hardMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR || recognizing) return;
  const w = HARD_WORDS[hardSession.deck[hardSession.pos]];
  const target = w.w.split(' ')[0];
  const r = new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3;
  recognizing = true; hardSession.micStatus='listening'; render();
  let settled=false;
  const to = setTimeout(()=>{ if(settled) return; settled=true; recognizing=false; try{r.abort();}catch(e){} hardSession.micStatus='error'; render(); }, 6000);
  r.onresult = e=>{
    if(settled) return; settled=true; clearTimeout(to); recognizing=false;
    const alts = []; for(let k=0;k<e.results[0].length;k++) alts.push(e.results[0][k].transcript);
    const t = normalize(target);
    const hit = alts.some(a=>normalize(a)===t || normalize(a).split(' ').indexOf(t)>=0);
    hardSession.heard = alts[0]; hardSession.ok = hit; hardSession.micStatus='done';
    sfx(hit?'ok':'bad'); skillLog('S', hit); if(hit) addXP(2);
    render();
  };
  r.onerror = ()=>{ if(settled) return; settled=true; clearTimeout(to); recognizing=false; hardSession.micStatus='error'; render(); };
  r.onend = ()=>{ recognizing=false; };
  try{ r.start(); }catch(e){ settled=true; clearTimeout(to); recognizing=false; hardSession.micStatus='error'; render(); }
}

  hardSession.pos++; hardSession.micStatus=null; hardSession.heard=''; hardSession.ok=null;
  if(hardSession.pos>=hardSession.deck.length){ state.view='hardDone'; sfx('win'); render(); return; }

let statsData = {days:{}, acc:{L:[0,0],S:[0,0],R:[0,0],W:[0,0]}};
async function loadStats(){ try{ const r = await window.storage.get('stats:v1', false); if(r) statsData = JSON.parse(r.value); }catch(e){} }
let statsTimer = null;
function skillLog(k, ok){
  try{
    const d = localDay(); const day = statsData.days[d] = statsData.days[d] || {L:0,S:0,R:0,W:0};
    day[k] = (day[k]||0)+1;
    const a = statsData.acc[k] = statsData.acc[k] || [0,0]; a[1]++; if(ok) a[0]++;
    clearTimeout(statsTimer); statsTimer = setTimeout(()=>{ try{ window.storage.set('stats:v1', JSON.stringify(statsData), false); }catch(e){} }, 800);
  }catch(e){}
}
function statsStreak(){
  let n=0; const d = new Date();

    const key = localDay(d); const day = statsData.days[key];
    const tot = day ? (day.L||0)+(day.S||0)+(day.R||0)+(day.W||0) : 0;
    if(tot>0) n++; else if(i>0) break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function statsWeek(k){ let n=0; const d=new Date(); for(let i=0;i<7;i++){ const day = statsData.days[localDay(d)]; if(day) n+=day[k]||0; d.setDate(d.getDate()-1);} return n; }

function ri(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function genNumQ(){
  const kind = ['price','price','size','time','date','phone'][ri(0,5)];
  const tricky = [13,30,14,40,15,50,16,60,17,70,18,80,19,90];
  if(kind==='price'){
    const v = Math.random()<0.6 ? tricky[ri(0,tricky.length-1)] : ri(2,99);
    return {kind, ask:'Giá bao nhiêu TRIỆU đồng?', say:'The price is '+v+' million dong.', ans:String(v)};
  }
  if(kind==='size'){
    const w = ri(2,9), d = ri(0,1)? 5:0; const v = d? w+0.5 : w;
    return {kind, ask:'Chiều dài bao nhiêu MÉT?', say:'The wall is '+v+' meters long.', ans:String(v)};
  }
  if(kind==='time'){
    const h = ri(1,11), m = [0,15,30,45][ri(0,3)], ap = ri(0,1)?'a.m.':'p.m.';
    return {kind, ask:'Hẹn lúc mấy giờ? (gõ giờ và phút, ví dụ 2:45)', say:'The meeting is at '+h+':'+(m<10?'0'+m:m)+' '+ap, ans:h+':'+(m<10?'0'+m:m), ap};
  }
  if(kind==='date'){
    const mo = ri(0,11), dd = ri(1,28);
    return {kind, ask:'Hạn chót là NGÀY mấy?', say:'The deadline is '+MONTHS[mo]+' '+dd+'.', ans:String(dd)};
  }
  const digits = Array.from({length:9},()=>ri(0,9)).join('');
  return {kind:'phone', ask:'Gõ số điện thoại (9 chữ số)', say:digits.split('').map(d=>d==='0'?'zero':d).join(', '), ans:digits};
}

let shadow = null, shRec = null, shUrl = null;

async function shStart(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomic');
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks = [];
    shRec = new MediaRecorder(stream);
    shRec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    shRec.onstop = ()=>{ stream.getTracks().forEach(t=>t.stop()); shUrl = URL.createObjectURL(new Blob(chunks,{type:shRec.mimeType||'audio/webm'})); shadow.state='recorded'; render(); };
    shRec.start(); shadow.state='recording'; render();
    setTimeout(()=>{ if(shRec && shRec.state==='recording') shRec.stop(); }, 9000);
  }catch(e){ shadow.state='error'; render(); }
}
function shStop(){ if(shRec && shRec.state==='recording') shRec.stop(); }
function shPlay(){ if(shUrl){ const a = new Audio(shUrl); a.play(); } }
function shRate(good){
  if(good){ addXP(2); shadow.done++; }
  sfx(good?'ok':'bad'); skillLog('S', good);
  shadow.pos++; shadow.state='idle'; shUrl=null;
  if(shadow.pos>=shadow.deck.length){ sfx('win'); state.view='shadowDone'; render(); return; }
  render(); setTimeout(shSay,300);
}

function lev(a,b){ const m=[]; for(let i=0;i<=a.length;i++){ m[i]=[i]; } for(let j=0;j<=b.length;j++) m[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return m[a.length][b.length]; }
function mkCloze(p){
  const words = p.en.split(' ');
  const cand = words.map((w,i)=>({w:w.replace(/[^A-Za-z']/g,''),i})).filter(x=>x.w.length>=4 && !CLZ_STOP.has(x.w.toLowerCase()));
  if(!cand.length) return null;
  const c = cand[ri(0,cand.length-1)];
  const shown = words.map((w,i)=> i===c.i ? w.replace(c.w,'_____') : w).join(' ');
  return {p, shown, answer:c.w};
}
function startCloze(){

/* ============ TỪ ĐIỂN CHẠM LÀ TRA ============ */
const LEX = {};
(function buildLex(){
  const put = (w, o)=>{ const k = w.toLowerCase(); LEX[k] = Object.assign(LEX[k]||{w:w}, o); };
  LEX_GROUPS.forEach(g=>g.items.forEach(it=>put(it.w,{ipa:it.ipa, vi:it.vi, syn:it.syn})));
  WORD_BANK.forEach(b=>{ const base = b.word.replace(/\(.*?\)/g,'').trim(); if(base.indexOf(' ')<0 && b.vn){ const k = base.toLowerCase(); if(!LEX[k]) put(base,{vi:b.vn}); else if(!LEX[k].vi) LEX[k].vi=b.vn; if(b.example) LEX[k].ex=b.example; } });
  SCENARIOS.forEach(sc=>sc.words.forEach(w=>{ if(w.en.indexOf(' ')<0){ const k=w.en.toLowerCase(); if(!LEX[k]) put(w.en,{vi:w.vi}); } }));

let QX_IDX = null;
function qxNorm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim(); }
function qxBuild(){
  QX_IDX = {};
  SCENARIOS.forEach(sc=>sc.phrases.forEach(p=>{
    const info = {pattern:p.pattern, ctx:sc.title, alts:[{en:p.en,vi:p.vi}].concat(p.alts||[])};
    QX_IDX[qxNorm(p.en)] = info;
    (p.alts||[]).forEach(a=>{ const k=qxNorm(a.en); if(!QX_IDX[k]) QX_IDX[k]=info; });
  }));
  TOPICS.forEach(t=>{ ((t.speaking&&t.speaking.items)||[]).forEach(it=>{
    const k=qxNorm(it.target); if(QX_IDX[k] || !it.chunk) return;
    QX_IDX[k] = {pattern:it.chunk.pattern, note:it.chunk.explain, ctx:t.title||'', alts:[{en:it.target,vi:''}].concat((it.chunk.examples||[]).map(e=>({en:e,vi:''})))};
  }); });
}
function quickExplainHtml(en, opts){
  if(!QX_IDX) qxBuild();
  const k = qxNorm(en), info = QX_IDX[k], para = (typeof ENG_EXPLAIN!=='undefined') ? ENG_EXPLAIN[k] : null;
  if(!info && !para) return '';
  let h = `<div class="explain-box" style="margin-top:10px;"><div class="explain-line">🎧 ${listenSlowPair(en)}</div>`;
  if(para) h += `<div class="explain-line"><strong>In simple English:</strong> ${para} ${listenIconPairHtml(para,'phrase-play','')}</div>`;
  if(info){
    h += `<div class="explain-line"><strong>📐 Khuôn:</strong> <span style="font-family:var(--font-mono);color:var(--stamp);">${info.pattern}</span></div>`;
    if(info.note) h += `<div class="explain-line">${info.note}</div>`;
    const others = info.alts.filter(a=>qxNorm(a.en)!==k).slice(0,2);
    h += `<div class="explain-line"><strong>⚡ Dùng nhanh (3 bước):</strong><br>1️⃣ Chọn khuôn: <em>${info.pattern}</em><br>2️⃣ Giữ nguyên khung, chỉ thay phần trong [ ] theo ý bạn (<a href="#" onclick="openFrames();return false;">16 khuôn chuẩn</a>)`;
    if(others.length) h += ':' + others.map(a=>`<div class="sc-alt" style="margin:4px 0 0;">${listenIconPairHtml(a.en,'phrase-play','')}<div class="t"><strong>${a.en}</strong>${a.vi?`<i>${a.vi}</i>`:''}</div></div>`).join('');
    h += `<br>3️⃣ Đọc to 3 lần liền, rồi tự đặt 1 câu cho việc của bạn.</div>`;
  }
  return h + '</div>';
}

/* ============ ĐỌC BỒI (IPA → CÁCH ĐỌC KIỂU TIẾNG VIỆT) ============ */
const IV_MULTI = ['tʃ','dʒ','aɪ','eɪ','ɔɪ','aʊ','oʊ','ɑː','iː','uː','ɔː','ɜː'];
const IV_VOW = {'iː':'i','i':'i','ɪ':'i','e':'e','ɛ':'e','æ':'e','ɑː':'a','ɑ':'a','ɒ':'o','ɔː':'o','ɔ':'o','o':'ô','ʊ':'u','u':'u','uː':'u','ʌ':'â','ə':'ờ','ɚ':'ơ','ɝ':'ơ','ɜː':'ơ','a':'a','aɪ':'ai','eɪ':'ây','ɔɪ':'oi','aʊ':'ao','oʊ':'âu'};
const IV_CON = {'p':'p','b':'b','t':'t','d':'đ','k':'k','ɡ':'g','g':'g','f':'ph','v':'v','θ':'th','ð':'đ','s':'x','z':'z','ʃ':'s','ʒ':'gi','h':'h','tʃ':'ch','dʒ':'gi','m':'m','n':'n','ŋ':'ng','l':'l','r':'r','w':'w','j':'y'};
const IV_ONSET = new Set(['st','sp','sk','tr','pr','kr','br','dr','gr','fr','pl','bl','kl','gl','fl','sl','str','spr','skr','sw','tw','kw','θr','ʃr']);
function ipaViet(ipa){
  const s = ipa.replace(/[\/\[\]()]/g,'').replace(/ː(?![^])/g,'ː');
  const toks = [];
  for(let i=0;i<s.length;){
    const two = s.substr(i,2);
    if(IV_MULTI.indexOf(two)>=0){ toks.push(two); i+=2; continue; }
    const c = s[i]; i++;
    if(c==='ː') continue;
    if(c==='ˈ'||c==='ˌ'){ toks.push(c); continue; }
    if(IV_VOW[c]!==undefined || IV_CON[c]!==undefined) toks.push(c);
  }
  // nuclei
  const isV = t=>IV_VOW[t]!==undefined && !(t in IV_CON && IV_CON[t]!==undefined && t.length===1 && 'wj'.indexOf(t)>=0);
  const sylls = []; let cur = null, stressTok = -1, stressSyl = -1, run = [];
  const flushRun = ()=>{ run = []; };
  // assign tokens to syllables
  const vIdx = []; toks.forEach((t,k)=>{ if(t!=='ˈ' && t!=='ˌ' && IV_VOW[t]!==undefined) vIdx.push(k); });
  if(!vIdx.length) return '';
  const bounds = []; // start index of each syllable (token index)
  vIdx.forEach((vi,n)=>{
    if(n===0){ bounds.push(0); return; }
    const prev = vIdx[n-1]; let a = prev+1, b = vi; // tokens between
    const mids = []; for(let k=a;k<b;k++) if(toks[k]!=='ˈ' && toks[k]!=='ˌ') mids.push(k);
    let start = b; // default: boundary right before vowel
    if(mids.length){
      let onset = [mids[mids.length-1]];
      while(onset.length<mids.length){
        const cand = [mids[mids.length-1-onset.length]].concat(onset).map(k=>toks[k]).join('');
        if(IV_ONSET.has(cand)) onset.unshift(mids[mids.length-1-onset.length]); else break;
      }
      start = onset[0];
    } else start = b;
    // include stress marks directly before onset
    while(start-1>prev && (toks[start-1]==='ˈ'||toks[start-1]==='ˌ')) start--;
    bounds.push(start);
  });
  const out = [];
  bounds.forEach((st,n)=>{
    const en = n+1<bounds.length ? bounds[n+1] : toks.length; let txt='', primary=false;
    for(let k=st;k<en;k++){ const t=toks[k]; if(t==='ˈ'){ primary=true; continue; } if(t==='ˌ') continue; txt += (IV_VOW[t]!==undefined ? IV_VOW[t] : (IV_CON[t]||'')); }
    out.push({txt, primary});
  });
  const hasPrimary = out.some(o=>o.primary);
  return out.map(o=> (o.primary || out.length===1) ? o.txt.toUpperCase() : o.txt).join('-').replace(/GII/g,'GI').replace(/gii/g,'gi');
}
