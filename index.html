/* ============ TRÒ CHƠI BẮN BÓNG RÁP CÂU ============ */
let gm = null;
function gmChunks(en, pattern){
  const words = en.replace(/\s+/g,' ').trim().split(' ');
  let pre = (pattern||'').split(/\s*\+|\[/)[0].replace(/[.?!\/]+$/,'').trim();
  let n = pre ? pre.split(/\s+/).length : 0;
  if(!n || n>=words.length || words.slice(0,n).join(' ').toLowerCase().replace(/[.,?!]/g,'')!==pre.toLowerCase()) n = Math.min(2, Math.max(1,words.length-2));
  const out = [words.slice(0,n).join(' ')]; const rest = words.slice(n);
  if(rest.length<=2) out.push(rest.join(' ')); else { const h = Math.ceil(rest.length/2); out.push(rest.slice(0,h).join(' ')); out.push(rest.slice(h).join(' ')); }
  return out.filter(Boolean);
}
function gmDeck(){
  const items=[]; LESSONS.forEach((l,li)=>l.chunks.forEach(c=>c.ex.forEach(e=>items.push({li,p:c.p,en:e.en,vi:e.vi}))));
  return pickN(items,10);
}
function startGame(){ gmStop(); gm={deck:gmDeck(),pos:0,hearts:3,score:0,combo:0,best:0,filled:0,token:0,t:0}; state.view='game'; gmRound(); }
function gmStop(){ if(gm){ gm.token=0; clearInterval(gm.timer); } }
function gmRound(){
  const it = gm.deck[gm.pos]; const ch = gmChunks(it.en, it.p);
  const pool = []; LESSONS.forEach(l=>l.chunks.forEach(c=>c.ex.forEach(e=>{ if(e.en!==it.en) gmChunks(e.en,c.p).forEach(x=>pool.push(x)); })));
  const dis = pickN(Array.from(new Set(pool)).filter(x=>ch.indexOf(x)<0),4);
  const bubbles = shuffleArr(ch.map((t,i)=>({t,i,ok:true})).concat(dis.map(t=>({t,i:-1,ok:false}))));
  bubbles.forEach((b,k)=>{ b.x = 2+(k%2)*50 + Math.random()*3; b.y = 1+Math.floor(k/2)*24.5 + Math.random()*3; b.d = (2+Math.random()*2).toFixed(1); b.id=k; b.gone=false; });
  Object.assign(gm,{it,ch,bubbles,filled:0,pop:null,done:false,limit:Math.max(9, ch.length*4+3),left:0});
  gm.left = gm.limit; gm.token = Date.now(); const tok=gm.token; clearInterval(gm.timer);
  gm.timer = setInterval(()=>{ if(!gm||gm.token!==tok||gm.done) return; gm.left-=0.1; const bar=document.getElementById('gm-bar'); if(bar) bar.style.width = Math.max(0,gm.left/gm.limit*100)+'%'; if(gm.left<=0) gmMiss(); },100);
  render(); setTimeout(()=>speak(it.en),200);
}
function gmShoot(id){
  if(!gm||gm.done) return; const b=gm.bubbles[id]; if(!b||b.gone) return;
  if(b.ok && b.i===gm.filled){ b.gone=true; gm.filled++; gm.combo++; gm.best=Math.max(gm.best,gm.combo); gm.score += 10 + Math.min(gm.combo,5)*2; sfx('ok'); skillLog('W',true);
    if(gm.filled>=gm.ch.length){ gm.done=true; clearInterval(gm.timer); gm.score += Math.round(gm.left); addXP(2); setTimeout(()=>speak(gm.it.en),150); }
    render(); }
  else { gm.combo=0; gm.hearts--; sfx('bad'); skillLog('W',false); const el=document.getElementById('gb'+id); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } const h=document.getElementById('gm-hearts'); if(h) h.textContent='❤️'.repeat(Math.max(0,gm.hearts))+'🖤'.repeat(3-Math.max(0,gm.hearts)); if(gm.hearts<=0){ gmEnd(); } }
}
function gmMiss(){ if(gm.done) return; gm.hearts--; gm.combo=0; sfx('bad'); gm.done=true; gm.missed=true; clearInterval(gm.timer); if(gm.hearts<=0){ gmEnd(); return; } gm.filled=gm.ch.length; gm.bubbles.forEach(b=>{ if(b.ok) b.gone=true; }); render(); setTimeout(()=>speak(gm.it.en),150); }
function gmNext(){ gm.pos++; if(gm.pos>=gm.deck.length){ gmEnd(); return; } gm.missed=false; gmRound(); }
function gmEnd(){ gmStop(); const best = Math.max(gm.score, +(localStorage.getItem('gm:best')||0)); try{ localStorage.setItem('gm:best',best); }catch(e){} gm.bestAll=best; sfx(gm.hearts>0?'win':'lose'); state.view='gameDone'; render(); }
function renderGame(){
  const it=gm.it, line = gm.ch.map((c,i)=>`<span class="gm-slot ${i<gm.filled?'on':''}">${i<gm.filled?c:'＿＿'}</span>`).join(' ');
  const bs = gm.bubbles.filter(b=>!b.gone).map(b=>`<button id="gb${b.id}" class="gm-b" style="left:${b.x}%;top:${b.y}%;animation-duration:${b.d}s;" onclick="gmShoot(${b.id})">${b.t}</button>`).join('');
  const after = gm.done ? `<div class="sim-bubble me">${gm.missed?'⏰ Hết giờ. ':'🎯 Trúng! '}<strong>${it.en}</strong> ${listenSlowPair(it.en)}<div class="sc-vi">${it.vi}</div><div class="sc-formula">📐 ${it.p}</div></div><button class="btn-primary" onclick="gmNext()">${gm.pos+1>=gm.deck.length?'Xem kết quả':'Câu tiếp →'}</button>` : '';
  return `${headerHtml(false)}<div class="pages"><button class="home-link" style="margin-bottom:10px;color:var(--navy);border-color:var(--navy);" onclick="gmStop();goHome()">← Thoát</button>
  <div class="gm-top"><span id="gm-hearts">${'❤️'.repeat(Math.max(0,gm.hearts))+'🖤'.repeat(3-Math.max(0,gm.hearts))}</span><span>Câu ${gm.pos+1}/${gm.deck.length}</span><span>⭐ ${gm.score}${gm.combo>1?' · 🔥x'+gm.combo:''}</span></div>
  <div class="gm-timer"><div id="gm-bar" style="width:${Math.max(0,gm.left/gm.limit*100)}%"></div></div>
  <div class="sim-bubble"><div class="sc-vi">Bắn bóng theo ĐÚNG THỨ TỰ để ghép câu:</div><div style="font-size:1.12rem;font-weight:700;color:var(--navy);">${it.vi}</div><div class="gm-line">${line}</div></div>
  <div class="gm-arena">${gm.done?'':bs}${gm.done?'<div class="gm-win">'+(gm.missed?'⏰':'🎉')+'</div>':''}</div>${after}</div>`;
}
function renderGameDone(){
  return `${headerHtml(false)}<div class="pages" style="text-align:center;"><div style="font-size:3rem;">${gm.hearts>0?'🏆':'💪'}</div><h2 class="intro-title" style="justify-content:center;">${gm.hearts>0?'Hoàn thành!':'Hết tim rồi'}</h2>
  <p>Điểm: <b>${gm.score}</b> · Chuỗi đúng dài nhất: <b>${gm.best}</b> · Kỷ lục: <b>${gm.bestAll}</b></p><p class="sc-vi">Mỗi lượt chơi 10 câu mới từ ${LESSONS.length} bài học. Chơi 5 phút mỗi ngày là đủ.</p>
  <button class="btn-primary" onclick="startGame()">Chơi lại</button><button class="btn-secondary" onclick="goHome()">Về trang chủ</button></div>`;
}

const SENT_REACT = {"yes":["Vâng/Có","Trả lời đồng ý, rồi nói tiếp ý chính."],"no":["Không","Trả lời phủ định, rồi giải thích ngắn."],"sure":["Được thôi","Đồng ý một cách thoải mái."],"of course":["Tất nhiên","Đồng ý nhờ vả, nghe lịch sự."],"got it":["Hiểu rồi","Nghe xong và đã nắm ý — nói tự nhiên, hay dùng khi làm việc."],"understood":["Đã rõ","Giống 'Got it' nhưng trang trọng hơn."],"i see":["Ra vậy","Cho khách biết bạn đã hiểu/nhận thông tin."],"perfect":["Tuyệt","Khen/đồng ý hoàn toàn."],"great":["Tuyệt","Phản hồi tích cực ngắn gọn."],"good":["Tốt","Phản hồi tích cực, nhẹ."],"noted":["Đã ghi nhận","Cho khách biết bạn ghi nhớ và sẽ làm."],"exactly":["Chính xác","Đồng ý hoàn toàn với ý vừa nói."],"okay":["Được","Đồng ý/chấp nhận."],"done":["Xong","Báo đã làm xong."],"right":["Đúng","Xác nhận."],"interesting":["Thú vị","Nhận xét lịch sự, kéo dài cuộc trò chuyện."],"congratulations":["Chúc mừng","Mở lời khi khách có tin vui."],"you are right":["Bạn nói đúng","Đồng ý với góp ý của khách trước khi đưa giải pháp."],"that's right":["Đúng vậy","Xác nhận lại điều vừa nghe."],"that's fine":["Được rồi","Chấp nhận, không vấn đề."],"no problem":["Không sao","Đáp lại lời nhờ hoặc lời xin lỗi nhẹ; hoặc nhận làm việc khách nhờ."],"good idea":["Ý hay","Khen ý tưởng của người khác."],"much better":["Tốt hơn nhiều","Nhận xét sau khi đã sửa."],"that sounds fair":["Nghe hợp lý","Đồng ý với điều khoản/giá."],"really":["Thật á?","Ngạc nhiên nhẹ, mời người kia nói tiếp."],"that is possible":["Có thể được","Chấp nhận phương án."],"almost":["Gần xong","Báo tiến độ sắp hoàn thành."],"hmm":["Ừm","Đang suy nghĩ."],"oh":["Ồ","Ngạc nhiên nhẹ."]};
function lesSplitSent(en){ return en.replace(/[’]/g,"'").split(/(?<=[.?!])\s+/).map(x=>x.trim()).filter(Boolean); }
function lesSentHtml(en){
  const slot = t=>t.replace(/\[[^\]]*\]/g,m=>`<span class="slot">${m}</span>`);
  const sents = lesSplitSent(en), seen = new Set(), out = [], react = [];
  sents.forEach(sn=>{
    let base = sn.replace(/[.!?,]/g,'').trim().toLowerCase();
    if(SENT_REACT[base]){ react.push(base); return; }
    let core = sn.replace(/^[A-Z][a-z]+,\s+/,'').replace(/^(and|also|but|so),?\s+/i,'');
    const m = core.match(/^(yes|no|sure|of course|okay|good|great|perfect|oh|hmm|understood|got it|exactly|done|congratulations|very happy),\s+(.+)$/i);
    if(m){ const rw=m[1].toLowerCase(); if(SENT_REACT[rw]) react.push(rw); core = m[2]; }
    core = core.replace(/^[a-z]/,c=>c.toUpperCase());
    let hit = SENT_RULES.findIndex(r=>r[0].test(core));
    if(hit<0){ const wc = core.split(/\s+/).length; if(wc<=7 && !/\b(is|are|was|will|can|do|does|did|have|has|need|want|looks?|sounds?)\b/i.test(core)){ out.push({sn,frag:true}); return; } }
    if(hit<0){ out.push({sn,gen:true}); return; }
    if(seen.has(hit)) return; seen.add(hit); out.push({sn,r:SENT_RULES[hit]});
  });
  const rc = react.length?`<div class="lx-s"><div class="lx-k">PHẢN HỒI NGẮN</div>${react.map(w=>`<div class="lx-y"><b>${w}</b> = ${SENT_REACT[w][0]}. ${SENT_REACT[w][1]}</div>`).join('')}<div class="lx-r">⚡ Ráp nhanh: nghe xong → nói 1 từ phản hồi → rồi nói ý chính.</div></div>`:'';
  const blocks = out.slice(0,3).map(o=>{
    if(o.frag) return `<div class="lx-s"><div class="lx-en">${o.sn}</div><div class="lx-f">🧩 Khuôn: trả lời rút gọn = [đúng phần được hỏi]</div><div class="lx-y"><b>Vì sao:</b> Hội thoại thật không cần nói đủ câu. Được hỏi gì thì nói đúng phần đó (số lượng, giờ, nơi chốn).</div><div class="lx-r">⚡ Ráp nhanh: hỏi \"bao nhiêu / khi nào / ở đâu\" → trả lời đúng con số / giờ / nơi, không cần chủ ngữ + động từ.</div></div>`;
    if(o.gen) return `<div class="lx-s"><div class="lx-en">${o.sn}</div><div class="lx-f">🧩 Khuôn: Ai + làm gì + cho ai / ở đâu + khi nào</div><div class="lx-r">⚡ Ráp nhanh: câu kể luôn đi theo thứ tự AI → LÀM GÌ → CÁI GÌ → Ở ĐÂU / KHI NÀO. Giữ thứ tự này là đúng.</div></div>`;
    const r=o.r;
    return `<div class="lx-s"><div class="lx-en">${o.sn}</div>
      <div class="lx-f">🧩 Khuôn: ${slot(r[1])}</div>
      <div class="lx-y"><b>Vì sao:</b> ${r[2]}</div>
      <div class="lx-r">⚡ Ráp nhanh: ${r[3]}</div>
      <div class="lx-k">NÓI KHÁC ĐƯỢC KHÔNG?</div>${r[4].map(a=>`<div class="sc-alt" style="margin:4px 0 0;">${listenSlowPair(a[0].replace(/[\[\]]/g,''))}<div class="t"><strong>${slot(a[0])}</strong><i>${a[1]}</i></div></div>`).join('')}
      <div class="lx-k">VÍ DỤ NỮA</div>${r[5].map(a=>`<div class="sc-alt" style="margin:4px 0 0;">${listenSlowPair(a[0])}<div class="t"><strong>${a[0]}</strong><i>${a[1]}</i></div></div>`).join('')}</div>`;
  }).join('');
  return rc+blocks;
}

function lesLineUI(k){

function lesSpeak(t){ speak(t, undefined, undefined, les.slow?0.6:undefined); }
function playLesson(from){
  stopLesson(); const tok = les.token = Date.now(); const lines = LESSONS[les.i].lines; let k = from||0;
  const step = ()=>{
    if(!les || les.token!==tok) return;

function lesBuildQuiz(){
  const L = LESSONS[les.i], qs=[];
  const mine = L.lines.map((x,k)=>({x,k})).filter(o=>o.x.w==='C' && L.lines[o.k+1] && L.lines[o.k+1].w==='Y');
  const allY = []; LESSONS.forEach(l=>l.lines.forEach(x=>{ if(x.w==='Y') allY.push(x); }));
  pickN(mine,4).forEach(o=>{
    const good = L.lines[o.k+1];
    const wrong = pickN(allY.filter(a=>a.en!==good.en),3);
    qs.push({type:'listen', prompt:'Nghe khách nói, chọn câu trả lời hợp lý:', say:o.x.en, show:o.x.vi,
      opts:shuffleArr([{t:good.en,ok:true}].concat(wrong.map(w=>({t:w.en,ok:false})))), reveal:good.en+' — '+good.vi});
  });
  const allEx = []; LESSONS.forEach(l=>l.chunks.forEach(c=>c.ex.forEach(e=>allEx.push(e))));
  L.chunks.forEach(c=>{
    const o = c.ex[ri(0,c.ex.length-1)];
    const sib = c.ex.filter(e=>e.en!==o.en);
    const wrong = sib.concat(pickN(allEx.filter(e=>e.en!==o.en && !sib.includes(e)),3-sib.length));
    qs.push({type:'read', prompt:'Áp dụng khuôn "'+c.p+'" — câu nào nói đúng ý: "'+o.vi+'"?',
      opts:shuffleArr([{t:o.en,ok:true}].concat(wrong.slice(0,3).map(w=>({t:w.en,ok:false})))), reveal:o.en+'  (khuôn: '+c.p+')'});
  });
  return shuffleArr(qs);
}
function lesPick(k){
  if(les.picked!==null) return; les.picked=k; const q=les.qs[les.pos], ok=q.opts[k].ok;
  if(ok){ les.right++; addXP(2); } sfx(ok?'ok':'bad'); skillLog(q.type==='listen'?'L':'R', ok);
  lesSpeak(q.opts.find(o=>o.ok).t); render();
}
function lesNextQ(){

    const pct = Math.round(les.right/les.qs.length*100), id=LESSONS[les.i].id, prev=lesState.done[id];

function lesMic(k){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ les.spk={k,st:'nosr'}; render(); return; }
  if(recognizing) return;
  const target = LESSONS[les.i].lines[k].en;
  const r = new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3;
  recognizing = true; les.spk={k,st:'listening'}; render(); let settled=false;
  const to=setTimeout(()=>{ if(settled) return; settled=true; recognizing=false; try{r.abort();}catch(e){} les.spk={k,st:'error'}; render(); },7000);
  r.onresult = e=>{
    if(settled) return; settled=true; clearTimeout(to); recognizing=false;
    let best=0, heard=''; for(let a=0;a<e.results[0].length;a++){ const t=e.results[0][a].transcript, g=gradeFreeText(t,[target]); if(g.pct>=best){ best=g.pct; heard=t; } }
    const ok = best>=70; sfx(ok?'ok':'bad'); skillLog('S', ok); if(ok) addXP(2);
    les.spk={k,st:'done',pct:best,heard,ok}; render();
  };
  r.onerror=()=>{ if(settled) return; settled=true; clearTimeout(to); recognizing=false; les.spk={k,st:'error'}; render(); };
  r.onend=()=>{ recognizing=false; };
  try{ r.start(); }catch(e){ settled=true; clearTimeout(to); recognizing=false; les.spk={k,st:'error'}; render(); }
}
const LES_RUNGS = [['Nghe và đọc theo','Có chữ trước mặt. Chỉ nghe rồi đọc to, chưa chấm điểm.'],['Ráp câu từ các từ','Bấm các từ theo đúng thứ tự để ráp thành câu. Bấm 🔊 nghe nếu quên.'],['Nói theo, có chữ','Nhìn chữ và nói vào mic.'],['Nói không nhìn chữ','Chỉ có nghĩa tiếng Việt. Tự nói câu tiếng Anh. Kẹt thì bấm Gợi ý.']];
function lesMyLines(){ return LESSONS[les.i].lines.map((x,k)=>({x,k})).filter(o=>o.x.w==='Y').slice(0,4); }
function lesSpeakNext(){ les.pos++; les.spk=null; les.bld=null; les.hint=false; if(les.pos>=lesMyLines().length){ les.rung++; les.pos=0; if(les.rung>4){ lesGo('quiz'); return; } window.scrollTo(0,0); } render(); }
function lesNorm(t){ return t.toLowerCase().replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim(); }
function lesBldInit(k,text){ const w=text.split(/\s+/).map((t,id)=>({id,t})); let sh=shuffleArr(w.slice()); if(w.length>1 && sh.every((x,n)=>x.id===n)) sh.reverse(); les.bld={k,words:w,pool:sh,sel:[],st:''}; }
function lesBld(id){ const b=les.bld; if(!b||b.st==='ok') return; if(b.sel.indexOf(id)>=0) return; b.sel.push(id); if(b.sel.length===b.words.length){ const got=lesNorm(b.sel.map(i=>b.words[i].t).join(' ')), want=lesNorm(b.words.map(x=>x.t).join(' ')); b.st = got===want?'ok':'bad'; sfx(b.st==='ok'?'ok':'bad'); skillLog('W', b.st==='ok'); if(b.st==='ok') addXP(2); } render(); }
function lesBldUndo(id){ const b=les.bld; if(!b||b.st==='ok') return; b.sel=b.sel.filter(x=>x!==id); b.st=''; render(); }
function lesBldReset(){ const b=les.bld; b.sel=[]; b.st=''; render(); }

let sim = null;

function startSim(i){

function simSayClient(){ const t = SIMS[sim.i].turns[sim.turn]; if(t) setTimeout(()=>speak(t.c), 250); }
function simOptions(){
  const t = SIMS[sim.i].turns[sim.turn];
  const all = [{t:t.good, ok:true, w:'Đây là câu tự nhiên và đúng tình huống.'}].concat(t.bad.map(b=>({t:b.t, ok:false, w:b.w})));

function simPick(k){

}
function simToggleText(){ sim.showText = !sim.showText; render(); }
function simNext(){

  sim.turn++; sim.picked=null; sim.micStatus=null; sim.transcript=''; sim.score=null; sim.showText=false;
  if(sim.turn>=total){ sim.phase='write'; render(); return; }

function simMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR || recognizing) return;
  const target = SIMS[sim.i].turns[sim.turn].good;
  const r = new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
  recognizing = true; sim.micStatus='listening'; render();
  let settled=false;
  const to = setTimeout(()=>{ if(settled) return; settled=true; recognizing=false; try{r.abort();}catch(e){} sim.micStatus='error'; render(); }, 7000);
  r.onresult = e=>{ if(settled) return; settled=true; clearTimeout(to); recognizing=false;
    sim.transcript = e.results[0][0].transcript; sim.score = Math.min(100, Math.round(wordOverlap(sim.transcript, target)*100)); sim.micStatus='done'; if(sim.score>=70) addXP(2); sfx(sim.score>=70?'ok':'bad'); skillLog('S', sim.score>=70); render(); };
  r.onerror = ()=>{ if(settled) return; settled=true; clearTimeout(to); recognizing=false; sim.micStatus='error'; render(); };
  r.onend = ()=>{ recognizing=false; };

      <div class="sim-bubble me"><strong>Câu mẫu:</strong> ${w.en} ${listenIconPairHtml(w.en,'phrase-play','')}</div>
      <button class="btn-primary" onclick="simFinish()">Hoàn thành →</button>` :
      `<button class="btn-primary" onclick="simCheckWrite()">Kiểm tra</button>`;
    return `${headerHtml(false)}<div class="pages">
      <h2 class="intro-title">✍️ Viết để chốt</h2>
      <p>Viết bằng tiếng Anh: <strong>${w.vi}</strong></p>

      ${fb}</div>`;
  }
  const t = S.turns[sim.turn], opts = simOptions(), picked = sim.phase==='picked';
  const optHtml = opts.map((o,k)=>{
    let cls='sim-opt', why='';
    if(picked){ if(o.ok) cls+=' ok'; else if(k===sim.picked) { cls+=' no'; why=`<div class="sim-why">${o.w}</div>`; } }
    return `<button class="${cls}" ${picked?'disabled':`onclick="simPick(${k})"`}>${o.t}</button>${why}`;
  }).join('');
  let after='';
  if(picked){
    const good = t.good;
    const mic = sim.micStatus==='listening' ? `<button class="mic-btn listening" disabled>Đang nghe...</button>`
      : (speechSupported()? `<button class="mic-btn" onclick="simMic()">${svgIcon('mic',16)} Nói to câu đúng</button>` : '');
    const fb = sim.micStatus==='done' ? `<div class="transcript-box">Bạn nói: <strong>"${sim.transcript}"</strong></div><div class="feedback ${sim.score>=70?'good':(sim.score>=40?'mid':'bad')}">Độ khớp: ${sim.score}/100</div>` : (sim.micStatus==='error'?`<div class="hint">Không nghe rõ hoặc mic bị chặn — cứ đọc to rồi bấm tiếp.</div>`:'');
    after = `<div class="sim-bubble me"><strong>Câu hay nhất:</strong> ${good}<div class="sc-vi">${t.gv}</div>${listenIconPairHtml(good,'phrase-play','')}</div>
      ${mic}${fb}
      <button class="btn-primary" style="margin-top:12px;" onclick="simNext()">${sim.turn+1>=S.turns.length?'Sang phần viết →':'Tiếp →'}</button>`;
  }
  return `${headerHtml(false)}<div class="pages">
    <button class="home-link" style="margin-bottom:12px;color:var(--navy);border-color:var(--navy);" onclick="openSims()">← Thoát</button>
    <div class="item-count">${S.icon} ${S.title} · Lượt ${sim.turn+1}/${S.turns.length}</div>
    <div class="sim-bubble"><div style="display:flex;gap:10px;align-items:center;">${listenIconPairHtml(t.c,'phrase-play','')}
      <div style="flex:1;font-size:.95rem;">${sim.showText||picked ? t.c : '🎧 Khách đang nói — nghe và đoán ý'}${picked?`<div class="sc-vi">${t.cv}</div>`:''}</div></div>
      ${!sim.showText&&!picked?`<button class="home-link" style="margin-top:8px;color:var(--navy);border-color:var(--navy);" onclick="simToggleText()">Xem chữ</button>`:''}
    </div>
    <p style="color:var(--ink-soft);margin:14px 0 8px;">Bạn trả lời thế nào?</p>
    ${optHtml}${after}</div>`;
}

function containsPhrase(text, phrase){ return normalize(text).includes(normalize(phrase)); }
let emailSession = null;
function openEmailList(){ state.view='emaillist'; render(); }
function startEmail(idx){
  emailSession = {idx, checked:false, input:''};
  state.view = 'email';
  render();
}
function checkEmail(){
  const ex = EMAIL_EXERCISES[emailSession.idx];
  const el = document.getElementById('email-input');
  const val = el ? el.value : '';
  emailSession.input = val;
  emailSession.matched = ex.expectedPhrases.map(p=>containsPhrase(val, p));
  const matchCount = emailSession.matched.filter(Boolean).length;
  addXP(matchCount*4);
  sfx(matchCount>=Math.ceil(ex.expectedPhrases.length/2)?'ok':'bad');
  emailSession.checked = true;
  render();
}
function startDialogue(idx){
  dialogSession = {idx, qIdx:0, checked:false, currentSelection:null, correctArr:[], playing:false};
  state.view = 'dialogue';
  render();
}
function playDialogue(){
  const d = DIALOGUES[dialogSession.idx];
  window.speechSynthesis.cancel();
  d.lines.forEach(line=>{
    const u = new SpeechSynthesisUtterance(line.text);
    u.lang = 'en-US'; u.rate = 0.92;
    window.speechSynthesis.speak(u);
  });
}
function selectDialogOption(i){
  if(dialogSession.checked) return;
  dialogSession.currentSelection = i;
  render();
}
function checkDialogAnswer(){
  const d = DIALOGUES[dialogSession.idx];
  const q = d.questions[dialogSession.qIdx];
  if(dialogSession.currentSelection===null || dialogSession.currentSelection===undefined) return;
  const correct = dialogSession.currentSelection === q.correct;
  dialogSession.correctArr.push(correct);
  sfx(correct?'ok':'bad'); skillLog('L', correct);
  if(correct) addXP(6);
  dialogSession.checked = true;
  render();
}
function nextDialogQuestion(){
  const d = DIALOGUES[dialogSession.idx];
  dialogSession.checked = false;
  dialogSession.currentSelection = null;
  if(dialogSession.qIdx < d.questions.length - 1){
    dialogSession.qIdx++;
    render();
  } else {
    state.view = 'dialogueDone';
    render();
  }
}

async function sendAiMessage(){
  const el = document.getElementById('ai-input');
  const text = el ? el.value.trim() : '';
  if(!text || aiLoading) return;
  aiChatHistory.push({role:'user', content:text});
  el.value = '';
  aiLoading = true;
  render();
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': aiApiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:600,
        system: AI_SYSTEM_PROMPT,
        messages: aiChatHistory.map(m=>({role:m.role, content:m.content}))
      })
    });
    const data = await resp.json();
    if(data.error){
      aiChatHistory.push({role:'assistant', content:'⚠️ Lỗi: '+(data.error.message||'Không gọi được API. Kiểm tra lại API key.')});
    } else {
      const textOut = (data.content||[]).map(c=>c.text||'').join('\n');
      aiChatHistory.push({role:'assistant', content: textOut || '(không có phản hồi)'});
    }
  }catch(e){
    aiChatHistory.push({role:'assistant', content:'⚠️ Không kết nối được tới API. Kiểm tra mạng hoặc API key.'});
  }
  aiLoading = false;
  render();
  setTimeout(()=>{
    const box = document.getElementById('ai-messages');
    if(box) box.scrollTop = box.scrollHeight;
  }, 50);
}

function openTopic(id){ session = {topicId:id}; state.view='intro'; render(); }
function beginTopic(id){
  session = {
    topicId:id, skillIdx:0, itemIdx:0, checked:false, currentSelection:null,
    speakingStatus:null, lastTranscript:null, lastScore:0, lastInput:'',
    scores:{reading:[],listening:[],speaking:[],writing:[]},
    answers:{}
  };
  state.view='skill';
  render();
}
function answerKey(){ return session.skillIdx+'-'+session.itemIdx; }
function selectOption(idx){
  if(session.checked) return;
  session.currentSelection = idx;
  render();
}
function checkMCQ(){
  const topic = getTopic(session.topicId);
  const skillKey = SKILL_ORDER[session.skillIdx];
  const items = getItems(topic, skillKey);
  const item = items[session.itemIdx];
  if(session.currentSelection === null || session.currentSelection === undefined) return;
  const correct = session.currentSelection === item.correct;
  const key = answerKey();
  if(!session.answers[key]){
    session.scores[skillKey].push(correct);
    if(correct) addXP(5);
  }
  session.answers[key] = {selection:session.currentSelection, correct};
  sfx(correct?'ok':'bad');
  skillLog(({reading:'R',listening:'L',speaking:'S',writing:'W'})[skillKey]||'R', correct);
  session.checked = true;
  render();
}
function checkWriting(){
  const topic = getTopic(session.topicId);
  const items = topic.writing.items;
  const item = items[session.itemIdx];
  const val = document.getElementById('writing-input') ? document.getElementById('writing-input').value : '';
  const grade = gradeFreeText(val, item.accepted);
  const correct = grade.tier !== 'wrong';
  const key = answerKey();
  if(!session.answers[key]){
    session.scores.writing.push(correct);
    if(grade.tier==='correct') addXP(5);
    else if(grade.tier==='close') addXP(3);
  }
  session.answers[key] = {input:val, correct, grade};
  sfx(grade.tier==='wrong'?'bad':'ok');
  skillLog('W', grade.tier!=='wrong');
  session.checked = true;
  session.lastInput = val;
  session.lastGrade = grade;
  render();
}
function loadAnswerState(){
  const key = answerKey();
  const a = session.answers[key];
  session.showChunk = false;
  if(a && 'score' in a){
    session.speakingStatus = 'done';
    session.lastScore = a.score;
    session.lastTranscript = a.transcript || '';
  } else {
    session.speakingStatus = null;
    session.lastTranscript = null;
  }
  if(a){
    session.checked = true;
    session.currentSelection = 'selection' in a ? a.selection : null;
    session.lastInput = 'input' in a ? a.input : '';
    session.lastGrade = 'grade' in a ? a.grade : null;
  } else {
    session.checked = false;
    session.currentSelection = null;
    session.lastInput = '';
    session.lastGrade = null;
  }
}
function prevItem(){
  if(session.itemIdx > 0){
    session.itemIdx--;
  } else if(session.skillIdx > 0){
    const topic = getTopic(session.topicId);
    session.skillIdx--;
    const items = getItems(topic, SKILL_ORDER[session.skillIdx]);
    session.itemIdx = items.length - 1;
  } else {
    state.view = 'intro';
    render();
    return;
  }
  loadAnswerState();
  render();
}
function nextItem(){
  const topic = getTopic(session.topicId);
  const skillKey = SKILL_ORDER[session.skillIdx];
  const items = getItems(topic, skillKey);
  session.checked = false;
  session.currentSelection = null;
  session.speakingStatus = null;
  session.lastTranscript = null;
  session.showChunk = false;
  if(session.itemIdx < items.length - 1){
    session.itemIdx++;
  } else {
    if(session.skillIdx < SKILL_ORDER.length - 1){
      session.skillIdx++;
      session.itemIdx = 0;
    } else {
      finishTopic();
      return;
    }
  }
  render();
}
function computeSkillScore(skillKey){
  const arr = session.scores[skillKey];
  if(arr.length===0) return 0;
  if(skillKey==='speaking'){
    return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
  }
  const correctCount = arr.filter(Boolean).length;
  return Math.round((correctCount/arr.length)*100);
}
function finishTopic(){
  addXP(30);
  const scores = {
    reading:computeSkillScore('reading'),
    listening:computeSkillScore('listening'),
    speaking:computeSkillScore('speaking'),
    writing:computeSkillScore('writing'),
  };
  const overall = Math.round((scores.reading+scores.listening+scores.speaking+scores.writing)/4);
  const data = {scores, overall, date:new Date().toISOString().slice(0,10)};
  saveProgress(session.topicId, data);
  session.result = data;
  state.view='results';
  render();
}

  const linesHtml = d.lines.map(l=>`<div class="dialog-line"><strong>${l.speaker}:</strong> ${l.text}</div>`).join('');
  const opts = q.options.map((o,i)=>{

      else if(i===dialogSession.currentSelection) cls+=' incorrect';

    return `<button class="${cls}" ${dialogSession.checked?'disabled':''} onclick="selectDialogOption(${i})">${o}</button>`;

  const fb = dialogSession.checked
    ? `<div class="feedback ${dialogSession.currentSelection===q.correct?'good':'bad'}">${dialogSession.currentSelection===q.correct?'✓ Chính xác!':'✗ Đáp án đúng: '+q.options[q.correct]}</div>`

function explainVariant(v, type){
  v = v.trim();
  if(/ing$/.test(v)) return `dạng V-ing — dùng ngay sau giới từ, làm tính từ mô tả trước danh từ, hoặc ở thì tiếp diễn (is/am/are + ${v}) tùy câu.`;
  if(/est$/.test(v)) return 'so sánh nhất — dùng khi so sánh từ 3 đối tượng trở lên';
  if(/er$/.test(v) && type==='tt') return 'so sánh hơn — dùng khi so sánh 2 đối tượng';
  if(/ed$/.test(v)) return 'dạng quá khứ / phân từ — dùng để nói việc đã xảy ra, hoặc trong câu bị động';
  if(type==='đt' && /s$/.test(v)) return 'ngôi thứ 3 số ít — thêm "s" khi chủ ngữ là he/she/it, ở thì hiện tại đơn';
  if(type==='dt' && /s$/.test(v)) return 'số nhiều — dùng khi nói về nhiều hơn 1';
  return 'dạng biến đổi khác — thường dùng ở thì quá khứ hoặc ngữ cảnh khác trong câu';
}

function dictationHtml(id, target){
  const st = dictationState[id];
  if(st && st.checked){
    const grade = st.grade;
    const tierInfo = {
      correct:{cls:'good', msg:'✓ Chính xác!'},
      close:{cls:'mid', msg:`〜 Khá sát (${grade.pct}% khớp) — chấp nhận được!`},
      wrong:{cls:'bad', msg:`✗ Chưa khớp (${grade.pct}%).`}
    }[grade.tier];
    return `
    <div class="dictation-box">
      <div class="dict-label">${svgIcon('pencil',14)} Nghe và viết lại:</div>
      ${listenPairHtml(target, 'Phát lại')}
      <div class="feedback ${tierInfo.cls}">${tierInfo.msg} Câu đúng: "${target}"</div>
      ${writingExplainHtml(grade, st.input, target, null)}
      ${gradeLegendHtml()}
      <button class="btn-ghost" onclick="retryDictation('${id}')">Thử câu khác</button>
    </div>`;
  }
  return `
  <div class="dictation-box">
    <div class="dict-label">${svgIcon('pencil',14)} Nghe và viết lại câu bạn nghe được:</div>
    ${listenPairHtml(target, 'Phát âm thanh')}

    <button class="btn-primary" style="padding:9px 18px;font-size:.88rem;" onclick="checkDictation('${id}', '${target.replace(/'/g,"\\'")}')">Kiểm tra</button>
  </div>`;
}

  const dueRecall = countDue(FLASHCARDS.length, 'recall');

  const incompleteTopic = TOPICS.find(t => !progressCache[t.id] || progressCache[t.id].overall < 50);
  let icon, text, action;
  if(dueRecall >= 4){
    icon='lightning'; text=`${dueRecall} câu Phản xạ đã đến hạn ôn lại hôm nay`; action="startRecall()";
  } else if(duePron >= 4){
    icon='mic'; text=`${duePron} câu Phát âm đã đến hạn ôn lại hôm nay`; action="startPronPractice()";
  } else if(incompleteTopic){
    icon=incompleteTopic.icon; text=`Tiếp tục chủ đề "${incompleteTopic.title}"`; action=`openTopic('${incompleteTopic.id}')`;

    icon='certificate'; text='Đã hoàn thành hết 6 chủ đề — thử sức với Bài thi xếp trình độ'; action='startExam()';

    <div><h4>📅 Hôm nay nên học gì?</h4><p>${text}</p></div>

  </button>`;
}

function renderSkill(){
  const topic = getTopic(session.topicId);
  const skillKey = SKILL_ORDER[session.skillIdx];
  const items = getItems(topic, skillKey);
  const item = items[session.itemIdx];
  let body = '';
  if(skillKey==='reading') body = renderReading(topic, item);
  else if(skillKey==='listening') body = renderListening(topic, item);
  else if(skillKey==='speaking') body = renderSpeaking(topic, item);
  else if(skillKey==='writing') body = renderWriting(topic, item);

  return `
  ${headerHtml(true)}
  <div class="pages">
    <h2 class="intro-title" style="font-size:1.5rem;display:flex;align-items:center;gap:10px;">${svgIcon(topic.icon,24)} ${topic.title}</h2>
    ${stepperHtml()}
    <div class="item-count">${SKILL_LABEL[skillKey]} · Câu ${session.itemIdx+1}/${items.length}</div>
    ${body}
  </div>`;
}

function renderReading(topic, item){
  const opts = item.options.map((o,i)=>{
    let cls = 'option-btn';
    if(session.checked){
      if(i===item.correct) cls+=' correct';
      else if(i===session.currentSelection) cls+=' incorrect';
    } else if(i===session.currentSelection) cls+=' selected';
    return `<button class="${cls}" ${session.checked?'disabled':''} onclick="selectOption(${i})">${o}</button>`;
  }).join('');
  const icon = pickIcon(item.q, topic.icon);
  return `
  <div class="exercise-card">
    ${qBannerHtml(topic)}
    <div class="passage">${topic.reading.passage}</div>
    <div class="q-text">${item.q}</div>
    <div class="options">${opts}</div>
    ${feedbackBlockMCQ(item)}
    ${navRow('checkMCQ')}
  </div>`;
}

function renderListening(topic, item){
  const opts = item.options.map((o,i)=>{
    let cls = 'option-btn';
    if(session.checked){
      if(i===item.correct) cls+=' correct';
      else if(i===session.currentSelection) cls+=' incorrect';
    } else if(i===session.currentSelection) cls+=' selected';
    return `<button class="${cls}" ${session.checked?'disabled':''} onclick="selectOption(${i})">${o}</button>`;
  }).join('');
  const icon = pickIcon(item.text + ' ' + item.q, topic.icon);
  return `
  <div class="exercise-card">
    ${qBannerHtml(topic)}
    ${listenPairHtml(item.text, 'Nghe câu')}
    <div class="q-text">${item.q}</div>
    <div class="options">${opts}</div>
    ${feedbackBlockMCQ(item)}
    ${navRow('checkMCQ')}
  </div>`;
}

function listenIconPairHtml(text, cls, colorStyle){
  const t = text.replace(/'/g,"\\'");
  return `<button class="${cls}" ${colorStyle||''} onclick="speak('${t}')">${svgIcon('headphones',cls==='phrase-play'?16:13)}</button>`;
}
function listenPairHtml(text, label){
  const t = text.replace(/'/g,"\\'");
  return `<button class="listen-btn" onclick="speak('${t}')">${svgIcon('headphones',16)} ${label||'Nghe'}</button>`;
}
function qBannerHtml(topic){
  const svg = (SCENE_SVGS[topic.id] || '').replace(/\{accent\}/g, topic.accent);
  return `<div class="q-banner">${svg}</div>`;
}
function feedbackBlockMCQ(item){
  if(!session.checked) return '';
  const correct = session.currentSelection === item.correct;
  const fb = `<div class="feedback ${correct?'good':'bad'}">${correct? '✓ Chính xác!' : '✗ Chưa đúng. Đáp án đúng: '+item.options[item.correct]}</div>`;
  const noteBlock = item.note ? `<div class="explain-box"><div class="explain-line"><strong>Công thức:</strong> ${item.note}</div></div>` : '';
  return fb + noteBlock + (item.text ? quickExplainHtml(item.text) : '');
}

function renderSpeaking(topic, item){
  const status = session.speakingStatus;
  let controls = '';
  if(!status){
    controls = `
      ${listenPairHtml(item.target, 'Nghe mẫu')}<br/>
      ${speechSupported()
        ? `<button class="mic-btn" onclick="startListening('${item.target.replace(/'/g,"\\'")}')">${svgIcon('mic',16)} Nhấn để nói</button>
           <div class="hint">Mic không phản hồi được sau vài giây? App sẽ tự chuyển sang tự đánh giá. Hoặc chọn luôn bên dưới:</div>
           <button class="btn-secondary" onclick="rateSpeakingFallback(90)">Tôi nói tốt</button>
           <button class="btn-secondary" onclick="rateSpeakingFallback(50)">Cần luyện thêm</button>`
        : `<div class="hint" style="margin-bottom:10px;">Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy nghe mẫu, tự nói theo, rồi tự đánh giá:</div>
           <button class="btn-secondary" onclick="rateSpeakingFallback(90)">Tôi nói tốt</button>
           <button class="btn-secondary" onclick="rateSpeakingFallback(50)">Cần luyện thêm</button>`
      }`;
  } else if(status==='listening'){
    controls = `<button class="mic-btn listening" disabled>${svgIcon('mic',16)} Đang nghe...</button><div class="hint">Nếu không thấy hộp thoại xin quyền micro, có thể trình duyệt/khung xem đang chặn — app sẽ tự chuyển sang tự đánh giá sau vài giây.</div>`;
  } else if(status==='error'){
    controls = `
      <div class="feedback bad">${session.micTimedOut ? 'Micro không phản hồi (có thể do khung xem trước đang chặn quyền micro).' : 'Không nghe rõ hoặc chưa cấp quyền micro.'} Hãy tự đánh giá thay thế:</div>
      <button class="btn-secondary" onclick="rateSpeakingFallback(90)">Tôi nói tốt</button>
      <button class="btn-secondary" onclick="rateSpeakingFallback(50)">Cần luyện thêm</button>
      ${speechSupported() ? `<br/><button class="btn-ghost" onclick="startListening('${item.target.replace(/'/g,"\\'")}')">Thử mic lại</button>` : ''}`;
  } else if(status==='done'){
    const score = session.lastScore;
    const cls = score>=70?'good':(score>=40?'mid':'bad');
    const msg = score>=70?'✓ Phát âm tốt!':(score>=40?'Khá ổn, luyện thêm nhé.':'Chưa khớp lắm, hãy thử lại vài lần.');
    controls = `
      ${session.lastTranscript? `<div class="transcript-box">Bạn nói: <strong>"${session.lastTranscript}"</strong></div>`:''}
      <div class="feedback ${cls}">${msg} (${score}/100)</div>
      <div class="nav-row" style="justify-content:space-between;">
        ${(session.skillIdx===0 && session.itemIdx===0) ? `<button class="btn-ghost" onclick="state.view='intro'; render();">← Quay lại chủ đề</button>` : `<button class="btn-ghost" onclick="prevItem()">← Câu trước</button>`}
        <button class="btn-primary" onclick="commitSpeakingScore()">Câu tiếp theo</button>
      </div>`;
  }
  const icon = pickIcon(item.target, topic.icon);
  return `
  <div class="exercise-card">
    ${qBannerHtml(topic)}
    <div class="q-text">Nói theo mẫu:</div>
    <div class="target-phrase">${item.target}</div>
    ${item.tip? `<div class="tip-line">${svgIcon('info',14)} ${item.tip}</div>` : ''}
    ${item.casual? `<div class="casual-line">🗣️ Nói tự nhiên hơn: “${item.casual}”</div>` : ''}
    ${item.chunk ? `
      <button class="chunk-toggle" onclick="toggleChunk()">${session.showChunk? '▲ Ẩn cấu trúc & ví dụ':'▼ Xem cấu trúc & ví dụ khác'}</button>
      ${session.showChunk ? chunkBoxHtml(item.chunk) : ''}
    ` : ''}
    ${controls}
    ${session.speakingStatus!=='done' ? `<div class="nav-row" style="justify-content:flex-start;margin-top:14px;">${(session.skillIdx===0 && session.itemIdx===0) ? `<button class="btn-ghost" onclick="state.view='intro'; render();">← Quay lại chủ đề</button>` : `<button class="btn-ghost" onclick="prevItem()">← Câu trước</button>`}</div>` : ''}
  </div>`;
}

function chunkBoxHtml(chunk){
  const ex = chunk.examples.map(e=>`<li>${e}</li>`).join('');
  return `
  <div class="chunk-box">
    <div class="chunk-pattern">${chunk.pattern}</div>
    <div class="chunk-explain">${chunk.explain}</div>
    <ul class="chunk-examples">${ex}</ul>
  </div>`;
}
function toggleChunk(){ session.showChunk = !session.showChunk; render(); }

function renderWriting(topic, item){
  const disabled = session.checked;
  let feedback = '';
  if(session.checked){
    const grade = session.lastGrade || gradeFreeText(session.lastInput, item.accepted);
    const tierInfo = {
      correct:{cls:'good', msg:'✓ Chính xác!'},
      close:{cls:'mid', msg:`〜 Khá sát (${grade.pct}% khớp) — chấp nhận được!`},
      wrong:{cls:'bad', msg:`✗ Chưa đúng (${grade.pct}% khớp).`}
    }[grade.tier];
    const speakingItem = topic.speaking.items[session.itemIdx];
    const chunk = speakingItem ? speakingItem.chunk : null;
    feedback = `<div class="feedback ${tierInfo.cls}">${tierInfo.msg} Đáp án chuẩn: "${grade.bestAcc}"</div>
      ${writingExplainHtml(grade, session.lastInput, grade.bestAcc, chunk)}
      ${quickExplainHtml(grade.bestAcc)}
      ${gradeLegendHtml()}`;
  }
  const icon = pickIcon(item.prompt, topic.icon);
  return `
  <div class="exercise-card">
    ${qBannerHtml(topic)}
    <div class="q-text">Dịch câu sau sang tiếng Anh:</div>
    <div class="target-phrase" style="font-size:1.1rem;">${item.prompt}</div>
    <input type="text" id="writing-input" placeholder="Nhập câu tiếng Anh..." ${disabled?'disabled':''} value="${session.checked && session.lastInput ? session.lastInput.replace(/"/g,'&quot;') : ''}"/>
    ${feedback}
    ${navRow('checkWriting')}
  </div>`;
}

function navRow(checkFn){
  const isVeryFirst = session.skillIdx===0 && session.itemIdx===0;
  const backBtn = isVeryFirst
    ? `<button class="btn-ghost" onclick="state.view='intro'; render();">← Quay lại chủ đề</button>`
    : `<button class="btn-ghost" onclick="prevItem()">← Câu trước</button>`;
  if(!session.checked){
    return `<div class="nav-row" style="justify-content:space-between;">${backBtn}<button class="btn-primary" onclick="${checkFn}()">Kiểm tra</button></div>`;
  }
  return `<div class="nav-row" style="justify-content:space-between;">${backBtn}<button class="btn-primary" onclick="nextItem()">Câu tiếp theo</button></div>`;
}

function gradeText(score){
  if(score>=85) return 'Xuất sắc';
  if(score>=70) return 'Tốt';
  if(score>=50) return 'Khá, cần luyện thêm';
  return 'Cần học lại phần này';
}

function renderResults(){
  const topic = getTopic(session.topicId);
  const r = session.result;
  const passed = r.overall >= 50;
  const code = topic.id.slice(0,3).toUpperCase().padEnd(3,'X');
  const mrzRaw = `P<VNM${code}<KANE<NGUYEN<<SCORE${pad(r.overall,3)}<<<<<<`;
  const mrz = mrzRaw.replace(/</g,'&lt;');
  const skillCards = SKILL_ORDER.map(sk=>`
    <div class="sb-card">
      <div class="sk-icon">${svgIcon(SKILL_ICON[sk],20)}</div>
      <div class="sb-label">${SKILL_LABEL[sk]}</div>
      <div class="sb-score">${r.scores[sk]}/100</div>
    </div>`).join('');
  return `
  ${headerHtml(true)}
  <div class="pages">
    <div class="results-wrap">
      <div class="stamp ${passed?'':'fail'}">
        <div class="st-title">${passed? 'ĐÃ HOÀN THÀNH':'CHƯA ĐẠT'}</div>
        <div class="st-score">${r.overall}/100</div>
        <div class="st-date">${r.date}</div>
      </div>
      <div class="grade-line">${topic.title} — ${gradeText(r.overall)}</div>
      <div class="mrz">${mrz}</div>
    </div>
    <div class="skill-breakdown">${skillCards}</div>
    <div style="text-align:center;">
      <button class="btn-primary" onclick="beginTopic('${topic.id}')">Làm lại chủ đề này</button>
      <button class="btn-secondary" onclick="goHome()">Về danh sách chủ đề</button>
    </div>
  </div>`;
}

(async function init(){
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = ()=>{ cachedVoices = window.speechSynthesis.getVoices(); if(state.view==='voices') render(); };
    englishVoices();
  }
  await loadAllProgress();
  await loadVoiceSetting();
  await loadExamResult();
  await loadXP();
  await loadAiKey();
  await loadSrs();
  await loadPlan();
  await loadStages(); await loadLessons(); await loadRemind(); await loadEx4(); if(!remindTimer) remindTimer = setInterval(remindTick, 60000);
  await loadSfx();
  await loadStats();
  state.loading = false;
  state.view = 'home';
  render();
})();
</script>
